<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | NT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* === Biến CSS và Thiết lập chung === */
        :root {
            --primary-color: #3a7bfd;
            --background-image: url('4.jpg');
            --text-primary: #f0f2f5;
            --text-secondary: #b0b9c6;
            --surface-color: rgba(30, 32, 38, 0.9);
            /* Làm tối hơn cho dễ đọc */
            --surface-hover: rgba(45, 48, 56, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --danger-color: #ff5b5b;
            --streak-color: #ff9f43;
            --border-radius: 12px;
            --sidebar-width: 240px;
            --header-height: 70px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--background-image) no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* === Loading Screen Styles === */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        #loader-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            border: 8px solid var(--border-color);
            border-top: 8px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .loader-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* === Bố cục chính === */
        .page-container {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: var(--header-height) 1fr;
            grid-template-areas:
                "header header"
                "sidebar main";
            min-height: 100vh;
            transition: grid-template-columns 0.3s ease;
        }

        /* === Header === */
        .header {
            grid-area: header;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            gap: 10px;
            text-decoration: none;
        }

        .logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #welcome-message {
            font-weight: 500;
            display: none;
        }

        .streak-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 159, 67, 0.1);
            color: var(--streak-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid var(--streak-color);
        }

        .tool-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(58, 123, 253, 0.1);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid var(--primary-color);
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .tool-box:hover {
            background: rgba(58, 123, 253, 0.3);
        }

        .tool-box i {
            font-size: 1rem;
        }

        #avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #avatar:hover {
            transform: scale(1.1);
        }

        /* === Sidebar === */
        .sidebar {
            grid-area: sidebar;
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 99;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .sidebar-menu a i {
            font-size: 1.2rem;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: var(--primary-color);
            color: white;
        }

        #logoutBtn {
            margin-top: auto;
            width: 100%;
            padding: 15px;
            background-color: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        #logoutBtn:hover {
            background-color: var(--danger-color);
        }

        /* === Main Content Area === */
        main {
            grid-area: main;
            padding: 30px;
        }

        /* === Modals (Popups) === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 999;
        }

        .modal-overlay.show {
            display: block;
            opacity: 1;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 25px;
            z-index: 1001;
            display: none;
            box-shadow: 0 10px 30px var(--shadow-color);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .modal.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Avatar Menu */
        #avatarMenu {
            width: 200px;
            padding: 10px;
            top: calc(var(--header-height) + 10px);
            left: auto;
            right: 30px;
            transform: none;
        }

        #avatarMenu button {
            width: 100%;
            padding: 12px 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        #avatarMenu button:hover {
            background: var(--primary-color);
            color: white;
        }

        /* Avatar Viewer */
        #avatarViewer .viewer-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #avatarViewer img {
            max-width: 80vw;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
        }

        #closeViewer {
            margin-top: 15px;
        }

        /* Subject Menu */
        #subjectMenu {
            width: 350px;
        }

        #subjectMenu h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .subject-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .subject-btn {
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: 500;
        }

        .subject-btn:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
        }

        .btn-close-modal {
            display: block;
            margin: 20px auto 0;
            padding: 10px 25px;
            background-color: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
        }

        .btn-close-modal:hover {
            background-color: var(--danger-color);
        }


        /* === CHAT WIDGET STYLES (Phần bạn thêm) === */
        #chat-widget {
            position: fixed;
            bottom: 20px;
            right: 25px;
            z-index: 1500;
        }

        #chat-bubble {
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: transform 0.2s, background 0.3s;
        }

        #chat-bubble:hover {
            transform: scale(1.1);
            background: #5b92ff;
        }

        #chat-box {
            display: none;
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 350px;
            /* Tăng chiều rộng */
            height: 450px;
            /* Tăng chiều cao */
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow-color);
            overflow: hidden;
            display: flex;
            /* Dùng flex để bố cục bên trong */
            flex-direction: column;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #chat-header {
            background: var(--primary-color);
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            /* Không co lại */
        }

        #chat-header span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        #chat-close:hover {
            color: var(--danger-color);
        }

        #chat-messages {
            flex-grow: 1;
            /* Cho phép mở rộng chiều cao */
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: rgba(0, 0, 0, 0.1);
            /* Màu nền nhẹ cho khu vực tin nhắn */
        }

        .chat-msg {
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.4;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            align-self: flex-start;
            background: var(--surface-hover);
            /* Màu nền tối hơn, nổi bật hơn */
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        #chat-input-area {
            display: flex;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        #chat-input {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
            font-size: 1rem;
        }

        #chat-send {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        #chat-send:hover {
            background: #5b92ff;
        }

        /* === HIỆU ỨNG 3 CHẤM (TYPING INDICATOR) === */
        #typing-indicator {
            align-self: flex-start;
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            background: var(--surface-hover);
            width: fit-content;
            margin: 10px 0;
        }

        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-primary);
            border-radius: 50%;
            margin: 0 2px;
            opacity: 0;
            animation: typing 1s infinite;
        }

        .typing-dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0% {
                transform: translateY(0);
                opacity: 0.5;
            }

            25% {
                transform: translateY(-4px);
                opacity: 1;
            }

            50% {
                transform: translateY(0);
                opacity: 0.5;
            }

            100% {
                transform: translateY(0);
                opacity: 0.5;
            }
        }
        /* === Responsive === */
        @media (max-width: 992px) {
            :root {
                --sidebar-width: 220px;
            }

            .page-container {
                grid-template-columns: var(--sidebar-width) 1fr;
            }
        }

        @media (max-width: 768px) {
            .page-container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "main";
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                height: 100vh;
                transform: translateX(-100%);
                box-shadow: 10px 0 20px var(--shadow-color);
                width: 250px;
            }

            .sidebar.open {
                transform: translateX(0);
                z-index: 1000;
            }

            .menu-toggle {
                display: block;
            }

            .header {
                padding: 0 15px;
            }

            #welcome-message {
                display: none;
            }

            .logo span {
                display: none;
            }

            /* Điều chỉnh Chat Widget trên Mobile */
            #chat-widget {
                bottom: 10px;
                right: 10px;
            }
            #chat-box {
                width: 95vw;
                height: 80vh;
                bottom: 75px;
                right: 50%;
                transform: translateX(50%); /* Canh giữa trên mobile */
            }
        }

        /* =====================================================
           BẢNG PHÂN TÍCH HỌC TẬP (trang chính)
           ===================================================== */
        .dash { max-width: 1200px; margin: 0 auto; }
        .dash-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .dash-head h1 { font-size: 1.9rem; font-weight: 700; line-height: 1.2; }
        .dash-head p { color: var(--text-secondary); margin-top: 4px; }
        .dash-btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px;
            background: linear-gradient(135deg, #3a7bfd, #7c5cff); color: #fff; text-decoration: none; font-weight: 600;
            box-shadow: 0 8px 22px rgba(58, 123, 253, .35); transition: transform .2s, box-shadow .2s;
        }
        .dash-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(58, 123, 253, .5); }
        .dash-btn i { font-size: 1.3rem; }

        .dash-grid { display: grid; gap: 20px; }
        .kpi-row { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 20px; }
        .two-col { grid-template-columns: 1.5fr 1fr; margin-bottom: 20px; }
        @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

        .card {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 18px; padding: 22px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px var(--shadow-color);
        }
        .card h3 { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .card h3 i { color: var(--primary-color); font-size: 1.3rem; }
        .card .sub { color: var(--text-secondary); font-size: .85rem; margin-bottom: 16px; }

        /* Thẻ số liệu */
        .kpi { display: flex; align-items: center; gap: 16px; }
        .kpi-icon { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 1.7rem; flex-shrink: 0; }
        .kpi-num { font-size: 2rem; font-weight: 700; line-height: 1; }
        .kpi-label { color: var(--text-secondary); font-size: .85rem; margin-top: 6px; }
        .kpi-link { display: inline-block; margin-top: 8px; color: #7fb0ff; font-size: .82rem; font-weight: 600; text-decoration: none; }
        .kpi-link:hover { text-decoration: underline; }
        .ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
        .ring svg { transform: rotate(-90deg); }
        .ring .ring-val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.35rem; font-weight: 700; }

        /* Màu theo mức độ */
        .lv-weak { --lv: #ff5b5b; } .lv-improve { --lv: #ff9f43; }
        .lv-good { --lv: #2ecc71; } .lv-insufficient { --lv: #8a94a6; }
        .badge-lv {
            display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 600;
            color: var(--lv); background: color-mix(in srgb, var(--lv) 16%, transparent); border: 1px solid color-mix(in srgb, var(--lv) 40%, transparent);
        }

        /* Biểu đồ theo môn */
        .subj { padding: 14px 0; border-top: 1px solid var(--border-color); }
        .subj:first-of-type { border-top: 0; padding-top: 0; }
        .subj-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        .subj-name { font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .subj-pct { font-weight: 700; color: var(--lv); }
        .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
        .bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--lv) 70%, #fff 0%), var(--lv)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
        .subj-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: .82rem; color: var(--text-secondary); }
        .subj-actions a { color: #7fb0ff; font-weight: 600; text-decoration: none; margin-left: 14px; }
        .subj-actions a:hover { text-decoration: underline; }
        .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; font-size: .75rem; color: var(--text-secondary); }
        .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--lv); }

        /* Biểu đồ 7 ngày */
        .days { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding-top: 10px; }
        .day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
        .day-col { width: 100%; max-width: 38px; display: flex; flex-direction: column-reverse; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.05); }
        .day-col .ok { background: #2ecc71; } .day-col .bad { background: #ff5b5b; }
        .day-n { font-size: .75rem; font-weight: 600; color: var(--text-primary); }
        .day-l { font-size: .7rem; color: var(--text-secondary); }
        .chips { display: flex; gap: 10px; flex-wrap: wrap; }
        .chip { flex: 1 1 180px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--border-color); }
        .chip b { color: var(--lv); font-size: 1.3rem; }

        /* Gợi ý */
        .tips { list-style: none; display: grid; gap: 10px; }
        .tip { display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--lv) 10%, transparent); border: 1px solid color-mix(in srgb, var(--lv) 30%, transparent); line-height: 1.5; }
        .tip i { font-size: 1.4rem; color: var(--lv); flex-shrink: 0; margin-top: 1px; }
        .tip-danger { --lv: #ff5b5b; } .tip-warn { --lv: #ff9f43; } .tip-good { --lv: #2ecc71; } .tip-info { --lv: #3a7bfd; }

        /* Câu cần ôn */
        .rv { border: 1px solid var(--border-color); border-radius: 14px; background: rgba(255,255,255,.03); margin-top: 10px; overflow: hidden; }
        .rv summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
        .rv summary::-webkit-details-marker { display: none; }
        .rv summary:hover { background: rgba(255,255,255,.04); }

    <div id="chat-widget">
        <div id="chat-bubble"><i class="bx bx-message-rounded-dots"></i></div>
        <div id="chat-box">
            <div id="chat-header">
                <span>🤖 AI Học Tập</span>
                <button id="chat-close">&times;</button>
            </div>
            <div id="chat-messages">
                </div>
            <div id="typing-indicator" style="display:none;" class="bot-msg">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Nhập câu hỏi, bài tập..." />
                <button id="chat-send"><i class="bx bx-send"></i></button>
            </div>
        </div>
    </div>
    <script>
        // Khai báo biến global để lưu userData
        let userData = {};

        document.addEventListener('DOMContentLoaded', function () {
            // 👉 Lấy thông tin đăng nhập từ localStorage
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            userData = JSON.parse(localStorage.getItem('userData') || '{}');

            if (!isLoggedIn || !userData.username || !userData.role) {
                alert('Vui lòng đăng nhập để sử dụng!');
                window.location.href = '1.html';
                return;
            }

            // 👉 Chỉ cho phép student
            if (userData.role !== "teacher") {
                alert("Bạn không có quyền truy cập trang này. Vui lòng đăng nhập bằng tài khoản Student.");
                window.location.href = "1.html";
                return;
            }

            const welcomeBox = document.getElementById('welcome-message');
            if (welcomeBox && userData.username) {
                welcomeBox.textContent = `Xin chào, ${userData.username}!`;
            }

            // === Logic Chat (Phần bạn cung cấp) ===
            const chatBubble = document.getElementById("chat-bubble");
            const chatBox = document.getElementById("chat-box");
            const chatClose = document.getElementById("chat-close");
            const chatSend = document.getElementById("chat-send");
            const chatInput = document.getElementById("chat-input");
            const chatMessages = document.getElementById("chat-messages");
            const typingIndicator = document.getElementById("typing-indicator");

            // Khởi tạo: Ẩn chat box, hiển thị bubble
            chatBox.style.display = "none";
            chatBubble.style.display = "flex";

            // Thêm tin nhắn chào mừng mặc định khi trang tải xong
            addMessage("Chào mừng! Tôi là AI Học Tập. Tôi có thể giúp bạn giải bài tập, tóm tắt bài giảng hoặc trả lời câu hỏi. Bạn muốn hỏi gì hôm nay?", "bot");


            chatBubble.addEventListener("click", () => {
                chatBox.style.display = "flex";
                chatBubble.style.display = "none";
                chatInput.focus();
                // Cuộn xuống dưới cùng khi mở chat
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });

            chatClose.addEventListener("click", () => {
                chatBox.style.display = "none";
                chatBubble.style.display = "flex";
            });

            function addMessage(text, sender = "bot") {
                const msg = document.createElement("div");
                msg.classList.add("chat-msg", sender === "user" ? "user-msg" : "bot-msg");
                msg.textContent = text;
                chatMessages.appendChild(msg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            chatSend.addEventListener("click", sendMessage);
            chatInput.addEventListener("keypress", e => {
                if (e.key === "Enter") sendMessage();
            });

            function showTypingIndicator() {
                // Chỉ thêm vào DOM nếu chưa có
                if (!typingIndicator.parentNode || typingIndicator.parentNode.id !== 'chat-messages') {
                    chatMessages.appendChild(typingIndicator);
                }
                typingIndicator.style.display = "flex";
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function hideTypingIndicator() {
                typingIndicator.style.display = "none";
                // Không cần xóa khỏi DOM, chỉ cần ẩn đi là được
            }

            function sendMessage() {
                const text = chatInput.value.trim();
                if (!text) return;

                addMessage(text, "user");
                chatInput.value = "";
                showTypingIndicator(); // Bắt đầu hiển thị 3 chấm

                // *** PHẦN NÀY ĐANG MÔ PHỎNG PHẢN HỒI AI (TẠM THỜI) ***
                /*
                const mockResponse = `Tôi đã nhận được câu hỏi của bạn: "${text}". Dưới đây là câu trả lời mô phỏng: [Giải pháp cho câu hỏi của bạn]`;

                // Mô phỏng thời gian phản hồi của AI (2-3 giây)
                setTimeout(() => {
                    hideTypingIndicator(); // Ẩn 3 chấm
                    addMessage(mockResponse, "bot");
                }, 2500);
                */

                // PHẦN CODE NÀY DÙNG ĐỂ GỌI API THỰC TẾ (HÃY BỎ COMMENT ĐỂ SỬ DỤNG):
                fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                })
                    .then(res => {
                        if (!res.ok) {
                            throw new Error(`HTTP error! status: ${res.status}`);
                        }
                        return res.json();
                    })
                    .then(data => {
                        hideTypingIndicator();
                        // Giả định API trả về đối tượng { reply: "..." }
                        addMessage(data.reply || "⚠️ Không có phản hồi từ AI. Vui lòng kiểm tra dữ liệu API.", "bot");
                    })
                    .catch(error => {
                        hideTypingIndicator();
                        console.error('Lỗi khi gọi API chat:', error);
                        addMessage("⚠️ Lỗi kết nối đến AI server hoặc API không hợp lệ. Vui lòng kiểm tra đường dẫn **`/api/chat`**.", "bot");
                    });
            }
        });

        // === Quản lý Modal (Popup) - Đã có sẵn ===
        const modalOverlay = document.getElementById('modal-overlay');
        const allModals = document.querySelectorAll('.modal');
        const sidebar = document.getElementById('sidebar');

        function openModal(modal) {
            if (modal == null) return;
            modal.classList.add('show');
            modalOverlay.classList.add('show');
        }

        function closeModal(modal) {
            if (modal == null) return;
            modal.classList.remove('show');
            modalOverlay.classList.remove('show');
        }

        document.querySelectorAll('.btn-close-modal').forEach(button => {
            button.addEventListener('click', () => {
                const modal = button.closest('.modal');
                closeModal(modal);
            });
        });

        // === Menu mobile - Đã có sẵn ===
        const menuToggle = document.getElementById('menu-toggle');
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            modalOverlay.classList.toggle('show');
        });

        // === Hợp nhất quản lý sự kiện click trên Overlay (Đã có sẵn) ===
        modalOverlay.addEventListener('click', () => {
            allModals.forEach(modal => {
                if (modal.classList.contains('show')) {
                    closeModal(modal);
                }
            });

            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                modalOverlay.classList.remove('show');
            }
        });

        // === Phần Logout ===
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userData');
            localStorage.removeItem('loginStreak');
            localStorage.removeItem('lastLoginDate');
            alert('Đăng xuất thành công!');
            window.location.href = '1.html';
        });

        // === Phần Avatar và menu ===
        const avatar = document.getElementById('avatar');
        const upload = document.getElementById('upload');
        const avatarMenu = document.getElementById('avatarMenu');
        const defaultAvatar = 'default-avatar.png';

        avatar.addEventListener('click', (e) => {
            e.stopPropagation();
            openModal(avatarMenu);
        });

        document.getElementById('viewAvatar').addEventListener('click', () => {
            const avatarViewer = document.getElementById('avatarViewer');
            document.getElementById('avatarLarge').src = avatar.src;
            closeModal(avatarMenu);
            openModal(avatarViewer);
        });

        document.getElementById('changeAvatar').addEventListener('click', () => {
            upload.click();
            closeModal(avatarMenu);
        });

        document.getElementById('deleteAvatar').addEventListener('click', () => {
            avatar.src = defaultAvatar;
            localStorage.removeItem('userAvatar');
            closeModal(avatarMenu);
        });

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                avatar.src = reader.result;
                localStorage.setItem('userAvatar', reader.result);
            };
            reader.readAsDataURL(file);
        });

        window.addEventListener('load', () => {
            const savedAvatar = localStorage.getItem('userAvatar');
            avatar.src = savedAvatar ? savedAvatar : defaultAvatar;
        });

        // === Phần Streak Counter ===
        const streakKey = "loginStreak";
        const lastLoginKey = "lastLoginDate";
        let streak = parseInt(localStorage.getItem(streakKey)) || 0;
        let lastLogin = localStorage.getItem(lastLoginKey);
        const today = new Date().toDateString();

        function daysBetween(date1Str, date2Str) {
            const d1 = new Date(date1Str);
            const d2 = new Date(date2Str);
            const diffTime = d2.setHours(0, 0, 0, 0) - d1.setHours(0, 0, 0, 0);
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }

        if (lastLogin !== today) {
            if (lastLogin && daysBetween(lastLogin, today) === 1) {
                streak++;
            } else {
                streak = 1;
            }
            localStorage.setItem(streakKey, streak);
            localStorage.setItem(lastLoginKey, today);
        }
        document.getElementById("streak-count").textContent = streak;

        // === Phần Menu Môn Học ===
        document.getElementById('homeworkBtn').addEventListener('click', () => {
  window.location.href = 'bai tap.html';
});
        const subjectMenu = document.getElementById('subjectMenu');

        homeworkBtn.addEventListener('click', (e) => {
            e.preventDefault();
            openModal(subjectMenu);
        });

        document.querySelectorAll('.subject-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const subject = btn.getAttribute('data-subject');
                if (subject) {
                    alert(`Chuyển đến trang bài tập môn ${btn.textContent}...`);
                    window.location.href = `${subject}.html`;
                }
                closeModal(subjectMenu);
            });
        });

        // === Hiệu ứng Loading Screen MỚI ===
        window.addEventListener('load', () => {
            const loaderWrapper = document.getElementById('loader-wrapper');
            setTimeout(() => {
                if (loaderWrapper) {
                    loaderWrapper.classList.add('hidden');
                }
            }, 300);
        });
    </script>
    <!-- Bảng tổng quan giáo viên (đọc dữ liệu từ /api/teacher/overview) -->
    <script>
    (function () {
        const LEVEL_TEXT = { weak: 'Yếu', improve: 'Cần cải thiện', good: 'Tốt', insufficient: 'Chưa đủ dữ liệu' };
        const TIP_ICON = { danger: 'bx-error-circle', warn: 'bx-trending-up', good: 'bx-check-circle', info: 'bx-info-circle' };
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const body = document.getElementById('dashBody');
        const sel = document.getElementById('classFilter');
        let showAllStudents = false;
        let lastData = null;

        const MATH_OPTS = {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
        };
        function renderMath(el, tries = 0) {
            if (window.renderMathInElement) { try { renderMathInElement(el, MATH_OPTS); } catch (e) { console.error(e); } }
            else if (tries < 20) setTimeout(() => renderMath(el, tries + 1), 250);
        }
        const ringColor = (acc) => acc < 50 ? '#ff5b5b' : acc < 75 ? '#ff9f43' : '#2ecc71';

        function ago(d) {
            if (d === null || d === undefined) return 'Chưa luyện';
            if (d === 0) return 'Hôm nay';
            return d + ' ngày trước';
        }

        function setSidebarBadge(href, n) {
            // link có thể nằm ở thanh bên hoặc ở nút "Quản lý lớp" trên đầu trang
            const a = document.querySelector(`.sidebar-menu a[href="${href}"], .tool-box[href="${href}"]`);
            if (!a) return;
            const old = a.querySelector('.nav-badge');
            if (old) old.remove();
            if (n > 0) a.insertAdjacentHTML('beforeend', `<span class="nav-badge">${n > 99 ? '99+' : n}</span>`);
        }

        function renderError(msg, loginNeeded) {
            body.innerHTML = `<div class="card dash-empty">
                <i class='bx bx-error' style="color:var(--danger-color)"></i>
                <p>${esc(msg)}</p>
                ${loginNeeded ? `<a href="1.html" class="dash-btn">Đăng nhập lại</a>` : `<a href="#" class="dash-btn" onclick="location.reload();return false;">Thử lại</a>`}
            </div>`;
        }

        function fillClassSelect(d) {
            const cur = d.selectedClassId || '';
            sel.innerHTML = `<option value="">Tất cả lớp (${d.totals.classes})</option>` +
                d.classes.map((c) => `<option value="${esc(c._id)}">${esc(c.name)} · ${c.students} HS${c.pending ? ` · ${c.pending} chờ duyệt` : ''}</option>`).join('');
            sel.value = cur;
        }

        function kpiCards(d) {
            const t = d.totals;
            return `<div class="dash-grid kpi-row five">
                <div class="card kpi"><div class="kpi-icon" style="background:rgba(58,123,253,.18);color:#7fb0ff"><i class='bx bx-building-house'></i></div>
                    <div><div class="kpi-num">${t.classes}</div><div class="kpi-label">Lớp học</div></div></div>
                <div class="card kpi"><div class="kpi-icon" style="background:rgba(46,204,113,.18);color:#2ecc71"><i class='bx bx-group'></i></div>
                    <div><div class="kpi-num">${t.students}</div><div class="kpi-label">Học sinh</div></div></div>
                <div class="card kpi"><div class="kpi-icon" style="background:rgba(124,92,255,.18);color:#a99bff"><i class='bx bx-edit'></i></div>
                    <div><div class="kpi-num">${t.exams}</div><div class="kpi-label">Đề thi đã tạo</div></div></div>
                <div class="card kpi ${t.pendingJoin ? 'alert-kpi' : ''}"><div class="kpi-icon" style="background:rgba(255,159,67,.18);color:#ff9f43"><i class='bx bx-user-plus'></i></div>
                    <div><div class="kpi-num">${t.pendingJoin}</div><div class="kpi-label">Yêu cầu vào lớp</div>
                        ${t.pendingJoin ? `<a class="kpi-link" href="teacher-classes.html">Duyệt ngay →</a>` : ''}</div></div>
                <div class="card kpi ${t.pendingQuestions ? 'alert-kpi' : ''}"><div class="kpi-icon" style="background:rgba(255,91,91,.18);color:#ff5b5b"><i class='bx bx-book-content'></i></div>
                    <div><div class="kpi-num">${t.pendingQuestions}</div><div class="kpi-label">Câu hỏi chờ duyệt</div>
                        ${t.pendingQuestions ? `<a class="kpi-link" href="nganhangcauhoi.html?tab=pending">Duyệt ngay →</a>` : ''}</div></div>
            </div>`;
        }

        function analysis(d) {
            const o = d.overall;
            if (o.totalStudents === 0) {
                return `<div class="card dash-empty"><i class='bx bx-user-plus'></i>
                    <h3 style="justify-content:center;font-size:1.25rem">Chưa có học sinh trong phạm vi này</h3>
                    <p>Hãy duyệt yêu cầu tham gia lớp để bắt đầu theo dõi kết quả học tập.</p>
                    <a href="teacher-classes.html" class="dash-btn"><i class='bx bx-group'></i> Quản lý lớp</a></div>`;
            }
            const tips = `<div class="card" style="margin-bottom:20px"><h3><i class='bx bx-bulb'></i> Gợi ý cho giáo viên</h3>
                <div class="sub">Dựa trên kết quả luyện tập của học sinh</div>
                <ul class="tips">${d.suggestions.map((x) => `<li class="tip tip-${x.tone}"><i class='bx ${TIP_ICON[x.tone] || 'bx-info-circle'}'></i><div>${esc(x.text)}</div></li>`).join('')}</ul></div>`;
            if (o.attempts === 0) return tips;

            const rc = ringColor(o.accuracy), C = 2 * Math.PI * 42;
            const t = d.thresholds;
            const subjects = d.bySubject.map((s) => `
                <div class="subj lv-${s.level}">
                    <div class="subj-top"><div class="subj-name">${esc(s.subject)} <span class="badge-lv">${LEVEL_TEXT[s.level]}</span></div>
                        <div class="subj-pct">${s.level === 'insufficient' ? '—' : s.accuracy + '%'}</div></div>
                    <div class="bar"><span style="width:${Math.max(s.accuracy, 2)}%"></span></div>
                    <div class="subj-foot"><span>${s.correct}/${s.attempts} lượt đúng · ${s.students} học sinh đã làm</span></div>
                </div>`).join('');
            const maxN = Math.max(1, ...d.daily.map((x) => x.attempts));
            const days = d.daily.map((x) => {
                const h = x.attempts ? Math.max(8, Math.round((x.attempts / maxN) * 130)) : 4;
                const okH = x.attempts ? Math.round((x.correct / x.attempts) * 100) : 0;
                return `<div class="day" title="${x.label}: ${x.correct}/${x.attempts} lượt đúng"><div class="day-n">${x.attempts || ''}</div>
                    <div class="day-col" style="height:${h}px"><div class="ok" style="height:${okH}%"></div><div class="bad" style="height:${x.attempts ? 100 - okH : 0}%"></div></div>
                    <div class="day-l">${x.label}</div></div>`;
            }).join('');

            const top = `<div class="dash-grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:20px">
                <div class="card kpi" style="gap:20px">
                    <div class="ring" style="width:110px;height:110px"><svg width="110" height="110" viewBox="0 0 96 96">
                        <circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>
                        <circle cx="48" cy="48" r="42" fill="none" stroke="${rc}" stroke-width="9" stroke-linecap="round"
                            stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - o.accuracy / 100)).toFixed(1)}"/></svg>
                        <div class="ring-val">${o.accuracy}%</div></div>
                    <div class="mini-stats">
                        <div style="color:var(--text-primary);font-weight:600;font-size:1rem">Độ chính xác cả lớp</div>
                        <div>Tổng lượt làm <b>${o.attempts}</b></div>
                        <div>Đang luyện (7 ngày) <b style="color:#2ecc71">${o.activeStudents}/${o.totalStudents}</b></div>
                        <div>Chưa luyện lần nào <b style="color:${o.neverPracticed ? '#ff9f43' : 'inherit'}">${o.neverPracticed}</b></div>
                        <div>Quá ${t.inactiveDays} ngày chưa luyện <b style="color:${o.inactive ? '#ff9f43' : 'inherit'}">${o.inactive}</b></div>
                    </div></div>
                <div class="card"><h3><i class='bx bx-calendar-check'></i> 7 ngày gần đây</h3>
                    <div class="sub">Số câu cả lớp làm mỗi ngày (<span style="color:#2ecc71">xanh: đúng</span>, <span style="color:#ff5b5b">đỏ: sai</span>)</div>
                    <div class="days">${days}</div></div></div>`;

            const subjCard = `<div class="card" style="margin-bottom:20px"><h3><i class='bx bx-bar-chart-alt-2'></i> Điểm yếu theo môn</h3>
                <div class="sub">Môn cả lớp yếu nhất xếp trên cùng. Cần ít nhất ${t.minAttempts} lượt/môn để đánh giá.</div>${subjects}
                <div class="legend"><span class="lv-weak"><i></i>Yếu (dưới 50%)</span><span class="lv-improve"><i></i>Cần cải thiện (dưới 75%)</span>
                    <span class="lv-good"><i></i>Tốt</span><span class="lv-insufficient"><i></i>Chưa đủ dữ liệu</span></div></div>`;

            const types = `<div class="card" style="margin-bottom:20px"><h3><i class='bx bx-category'></i> Theo dạng câu hỏi</h3>
                <div class="sub">Dạng câu hỏi nào cả lớp còn yếu</div>
                <div class="chips">${d.byType.map((x) => `<div class="chip lv-${x.level}">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-weight:600">${esc(x.label)}</span><span class="badge-lv">${LEVEL_TEXT[x.level]}</span></div>
                    <div style="margin-top:8px"><b>${x.level === 'insufficient' ? '—' : x.accuracy + '%'}</b><span style="color:var(--text-secondary);font-size:.82rem"> · ${x.correct}/${x.attempts} lượt</span></div></div>`).join('')}</div></div>`;

            return top + tips + subjCard + types + studentsCard(d) + missedCard(d);
        }

        function reasonPills(s) {
            const p = [];
            if (s.reasons.includes('never')) p.push('<span class="pill pill-gray">Chưa luyện</span>');
            if (s.reasons.includes('inactive')) p.push(`<span class="pill pill-orange">Lâu chưa luyện</span>`);
            if (s.reasons.includes('weak')) p.push('<span class="pill pill-red">Đúng thấp</span>');
            return p.join('');
        }

        function studentsCard(d) {
            const attn = d.students.filter((s) => s.needsAttention);
            const rows = (showAllStudents ? d.students : attn.slice(0, 8));
            const body = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>
                <th>Học sinh</th><th>Lượt làm</th><th>Độ chính xác</th><th>Luyện gần nhất</th><th>Môn yếu nhất</th><th>Ghi chú</th></tr></thead><tbody>
                ${rows.map((s) => `<tr class="lv-${s.level}">
                    <td><b>${esc(s.username)}</b></td><td>${s.attempts}</td>
                    <td>${s.attempts ? `<div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><span style="width:${Math.max(s.accuracy, 2)}%"></span></div><b style="color:var(--lv)">${s.accuracy}%</b></div>` : '—'}</td>
                    <td>${ago(s.daysSince)}</td>
                    <td>${s.weakest ? `${esc(s.weakest.subject)} <span style="color:#ff9a9a">(${s.weakest.accuracy}%)</span>` : '—'}</td>
                    <td>${reasonPills(s) || '<span style="color:var(--text-secondary)">—</span>'}</td></tr>`).join('')}
                </tbody></table></div>`
                : `<div class="dash-empty" style="padding:24px"><p style="margin:0">🎉 Không có học sinh nào cần chú ý lúc này.</p></div>`;
            const toggle = d.students.length > attn.slice(0, 8).length || showAllStudents
                ? `<button class="link-btn" id="toggleStudents">${showAllStudents ? '← Chỉ hiện học sinh cần chú ý' : `Xem tất cả ${d.students.length} học sinh →`}</button>` : '';
            return `<div class="card" style="margin-bottom:20px"><h3><i class='bx bx-user-voice'></i> ${showAllStudents ? 'Tất cả học sinh' : `Học sinh cần chú ý (${attn.length})`}</h3>
                <div class="sub">Chưa luyện lần nào, lâu chưa luyện, hoặc tỉ lệ đúng thấp</div>${body}${toggle}</div>`;
        }

        function missedCard(d) {
            if (!d.mostMissed.length) return '';
            return `<div class="card" id="missedCard"><h3><i class='bx bx-error-alt'></i> Câu cả lớp hay sai nhất</h3>
                <div class="sub">Những câu có tỉ lệ sai cao: nên giảng lại. Bấm vào để xem đáp án và giải thích.</div>
                ${d.mostMissed.map((r) => {
                    const ans = r.type === 'shortanswer'
                        ? `<div class="rv-opt right">Đáp án đúng: ${esc(r.correctAnswer)}</div>`
                        : r.options.map((op, i) => `<div class="rv-opt ${i === Number(r.correctAnswer) ? 'right' : ''}"><b>${String.fromCharCode(65 + i)}.</b> ${esc(op)}${i === Number(r.correctAnswer) ? ' ✓' : ''}</div>`).join('');
                    return `<details class="rv"><summary><div class="rv-q">${esc(r.question)}</div>
                        <div class="rv-meta"><span class="tag">${esc(r.subject)}</span><span class="tag tag-red">${r.studentsWrong}/${r.studentsTried} HS sai · ${r.wrongRate}%</span></div></summary>
                        <div class="rv-body">${ans}${r.explanation ? `<div class="rv-exp"><b>💡 Giải thích:</b> ${esc(r.explanation)}</div>` : ''}</div></details>`;
                }).join('')}</div>`;
        }

        function render(d) {
            lastData = d;
            fillClassSelect(d);
            setSidebarBadge('nganhangcauhoi.html', d.totals.pendingQuestions);
            setSidebarBadge('teacher-classes.html', d.totals.pendingJoin);
            if (d.totals.classes === 0) {
                body.innerHTML = kpiCards(d) + `<div class="card dash-empty"><i class='bx bx-building-house'></i>
                    <h3 style="justify-content:center;font-size:1.25rem">Bạn chưa có lớp học nào</h3>
                    <p>Tạo lớp và chia sẻ mã lớp để học sinh tham gia, sau đó bạn sẽ thấy phân tích tại đây.</p>
                    <a href="teacher-classes.html" class="dash-btn"><i class='bx bx-plus-circle'></i> Tạo lớp đầu tiên</a></div>`;
                return;
            }
            body.innerHTML = kpiCards(d) + analysis(d);
            const tg = document.getElementById('toggleStudents');
            if (tg) tg.onclick = () => { showAllStudents = !showAllStudents; render(lastData); };
            renderMath(body);
        }

        async function load(classId) {
            body.innerHTML = `<div class="dash-loading"><i class='bx bx-loader-alt bx-spin'></i> Đang tải tổng quan...</div>`;
            try {
                const res = await fetch('/api/teacher/overview' + (classId ? '?classId=' + encodeURIComponent(classId) : ''));
                if (res.status === 401) return renderError('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', true);
                const data = await res.json().catch(() => ({}));
                if (!res.ok) return renderError(data.message || 'Không tải được dữ liệu tổng quan.');
                showAllStudents = false;
                render(data);
            } catch (e) {
                renderError('Không kết nối được tới máy chủ.');
            }
        }

        sel.addEventListener('change', () => load(sel.value));
        load('');
    })();
    </script>

</body>
