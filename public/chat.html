<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trò chuyện | NT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
  /* Trang chat vừa khít một khung hình: chỉ danh sách tin nhắn cuộn */
  body[data-active="chat"] main { height: calc(100vh - var(--header-height)); display: flex; flex-direction: column; }
  body[data-active="chat"] .wrap { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body[data-active="chat"] .page-head { margin-bottom: 16px; }

  @supports (height: 100dvh) { body[data-active="chat"] main { height: calc(100dvh - var(--header-height)); } }
  .chat-card { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #messages { flex: 1; min-height: 0; list-style: none; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }

  .msg { max-width: min(70%, 520px); display: flex; flex-direction: column; gap: 4px; }
  .msg .who { font-size: .74rem; font-weight: 600; color: var(--text-secondary); padding: 0 6px; }
  .msg .bubble { padding: 10px 14px; border-radius: 18px; line-height: 1.45; overflow-wrap: anywhere; font-size: .95rem; background: var(--surface-hover); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.mine .bubble { background: linear-gradient(135deg, #3a7bfd, #7c5cff); border-color: transparent; color: #fff; border-bottom-left-radius: 18px; border-bottom-right-radius: 4px; }
  .msg img, .msg video { max-width: 240px; width: 100%; border-radius: 12px; display: block; }
  .msg a { color: #9cc0ff; }
  .msg.mine a { color: #fff; }
  .sys { align-self: center; font-size: .78rem; color: var(--text-secondary); background: rgba(255,255,255,.06); padding: 4px 14px; border-radius: 999px; }
  .chat-empty { margin: auto; text-align: center; color: var(--text-secondary); }
  .chat-empty i { display: block; font-size: 3rem; color: var(--primary-color); margin-bottom: 6px; }

  #form { display: flex; align-items: center; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--border-color); background: rgba(0,0,0,.18); }
  #input { flex: 1; min-width: 0; padding: 12px 18px; border-radius: 999px; font: inherit; font-size: .95rem; background: rgba(255,255,255,.06); border: 1px solid var(--border-color); color: var(--text-primary); transition: border-color .2s, box-shadow .2s; }
  #input::placeholder { color: rgba(176,185,198,.6); }
  #input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(58,123,253,.25); }
  .icon-btn { width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; display: grid; place-items: center; transition: background .2s; }
  .icon-btn:hover { background: rgba(255,255,255,.1); }
  .icon-btn i { font-size: 1.3rem; }
  .icon-file i { color: #ff9f43; } .icon-image i { color: #2ecc71; } .icon-video i { color: #ff5b5b; }
  .icon-send { background: linear-gradient(135deg, #3a7bfd, #7c5cff); box-shadow: 0 6px 16px rgba(58,123,253,.35); }
  .icon-send:hover { background: linear-gradient(135deg, #3a7bfd, #7c5cff); transform: translateY(-1px); }
  .icon-send i { color: #fff; }
  #file-input { display: none; }
  @media (max-width: 768px) { .msg { max-width: 88%; } #messages { padding: 14px; } .page-head p { display: none; } }
</style>
</head>
<body data-active="chat">
<main>
  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>Trò chuyện</h1>
        <p>Phòng chat chung – trao đổi bài vở cùng mọi người</p>
      </div>
      <span class="badge success" style="font-size:.85rem;padding:7px 14px"><i class='bx bxs-circle'></i> <span id="online-users">0</span> đang online</span>
    </div>

    <div class="card chat-card">
      <ul id="messages"><li class="chat-empty" id="chat-empty"><i class='bx bx-message-rounded-dots'></i>Chưa có tin nhắn nào. Hãy là người đầu tiên chào cả lớp!</li></ul>
      <input type="file" id="file-input">
      <form id="form">
        <button type="button" class="icon-btn icon-file" id="attach-file" title="Đính kèm tệp"><i class='bx bx-paperclip'></i></button>
        <button type="button" class="icon-btn icon-image" id="attach-image" title="Gửi hình ảnh"><i class='bx bx-image'></i></button>
        <button type="button" class="icon-btn icon-video" id="attach-video" title="Gửi video"><i class='bx bx-video'></i></button>
        <input id="input" autocomplete="off" placeholder="Nhập tin nhắn..." />
        <button type="submit" class="icon-btn icon-send" title="Gửi"><i class='bx bxs-send'></i></button>
      </form>
    </div>
  </div>
</main>

<script src="shell.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
</body>
</html>
