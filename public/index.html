<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | NT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* === Biến CSS và Thiết lập chung === */
        :root {
            --primary-color: #3a7bfd;
            --background-image: url('4.jpg');
            --text-primary: #f0f2f5;
            --text-secondary: #b0b9c6;
            --surface-color: rgba(30, 32, 38, 0.9); /* Làm tối hơn cho dễ đọc */
            --surface-hover: rgba(45, 48, 56, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --danger-color: #ff5b5b;
            --streak-color: #ff9f43;
            --border-radius: 12px;
            --sidebar-width: 240px;
            --header-height: 70px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--background-image) no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        /* === Loading Screen Styles === */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        #loader-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            border: 8px solid var(--border-color);
            border-top: 8px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .loader-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* === Bố cục chính === */
        .page-container {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: var(--header-height) 1fr;
            grid-template-areas:
                "header header"
                "sidebar main";
            min-height: 100vh;
            transition: grid-template-columns 0.3s ease;
        }

        /* === Header === */
        .header {
            grid-area: header;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            gap: 10px;
            text-decoration: none;
        }

        .logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #welcome-message {
            font-weight: 500;
            display: none;
        }
        
        .streak-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 159, 67, 0.1);
            color: var(--streak-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid var(--streak-color);
        }
        
        .tool-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(58, 123, 253, 0.1);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid var(--primary-color);
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .tool-box:hover {
            background: rgba(58, 123, 253, 0.3);
        }

        .tool-box i {
            font-size: 1rem;
        }

        #avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #avatar:hover {
            transform: scale(1.1);
        }

        /* === Sidebar === */
        .sidebar {
            grid-area: sidebar;
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 99;
        }
        
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .sidebar-menu a i {
            font-size: 1.2rem;
        }
        
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: var(--primary-color);
            color: white;
        }

        #logoutBtn {
            margin-top: auto;
            width: 100%;
            padding: 15px;
            background-color: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        #logoutBtn:hover {
            background-color: var(--danger-color);
        }

        /* === Main Content Area === */
        main {
            grid-area: main;
            padding: 30px;
        }

        /* === Modals (Popups) === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 999;
        }
        
        .modal-overlay.show { display: block; opacity: 1; }

        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 25px;
            z-index: 1001;
            display: none;
            box-shadow: 0 10px 30px var(--shadow-color);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .modal.show { 
            display: block; 
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        
        /* Avatar Menu */
        #avatarMenu {
            width: 200px;
            padding: 10px;
            top: calc(var(--header-height) + 10px);
            left: auto; right: 30px;
            transform: none;
        }
        #avatarMenu button {
            width: 100%;
            padding: 12px 15px;
            background: none; border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }
        #avatarMenu button:hover {
            background: var(--primary-color);
            color: white;
        }
        
        /* Avatar Viewer */
        #avatarViewer .viewer-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #avatarViewer img {
            max-width: 80vw;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
        }
        #closeViewer { margin-top: 15px; }

        /* Subject Menu */
        #subjectMenu {
            width: 350px;
        }
        #subjectMenu h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
        }
        .subject-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .subject-btn {
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: 500;
        }
        .subject-btn:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
        }
        
        .btn-close-modal {
            display: block;
            margin: 20px auto 0;
            padding: 10px 25px;
            background-color: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
        }
        .btn-close-modal:hover {
            background-color: var(--danger-color);
        }


        /* === Responsive === */
        @media (max-width: 992px) {
            :root { --sidebar-width: 220px; }
            .page-container {
                grid-template-columns: var(--sidebar-width) 1fr;
            }
        }

        @media (max-width: 768px) {
            .page-container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "main";
            }
            .sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                height: 100vh;
                transform: translateX(-100%);
                box-shadow: 10px 0 20px var(--shadow-color);
                width: 250px;
            }
            .sidebar.open {
                transform: translateX(0);
                z-index: 1000;
            }
            .menu-toggle {
                display: block;
            }
            .header { padding: 0 15px; }
            #welcome-message { display: none; }
            .logo span { display: none; }
        }

        /* =====================================================
           BẢNG PHÂN TÍCH HỌC TẬP (trang chính)
           ===================================================== */
        .dash { max-width: 1200px; margin: 0 auto; }
        .dash-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .dash-head h1 { font-size: 1.9rem; font-weight: 700; line-height: 1.2; }
        .dash-head p { color: var(--text-secondary); margin-top: 4px; }
        .dash-btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px;
            background: linear-gradient(135deg, #3a7bfd, #7c5cff); color: #fff; text-decoration: none; font-weight: 600;
            box-shadow: 0 8px 22px rgba(58, 123, 253, .35); transition: transform .2s, box-shadow .2s;
        }
        .dash-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(58, 123, 253, .5); }
        .dash-btn i { font-size: 1.3rem; }

        .dash-grid { display: grid; gap: 20px; }
        .kpi-row { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 20px; }
        .two-col { grid-template-columns: 1.5fr 1fr; margin-bottom: 20px; }
        @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

        .card {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 18px; padding: 22px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px var(--shadow-color);
        }
        .card h3 { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .card h3 i { color: var(--primary-color); font-size: 1.3rem; }
        .card .sub { color: var(--text-secondary); font-size: .85rem; margin-bottom: 16px; }

        /* Thẻ số liệu */
        .kpi { display: flex; align-items: center; gap: 16px; }
        .kpi-icon { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 1.7rem; flex-shrink: 0; }
        .kpi-num { font-size: 2rem; font-weight: 700; line-height: 1; }
        .kpi-label { color: var(--text-secondary); font-size: .85rem; margin-top: 6px; }
        .kpi-link { display: inline-block; margin-top: 8px; color: #7fb0ff; font-size: .82rem; font-weight: 600; text-decoration: none; }
        .kpi-link:hover { text-decoration: underline; }
        .ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
        .ring svg { transform: rotate(-90deg); }
        .ring .ring-val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.35rem; font-weight: 700; }

        /* Màu theo mức độ */
        .lv-weak { --lv: #ff5b5b; } .lv-improve { --lv: #ff9f43; }
        .lv-good { --lv: #2ecc71; } .lv-insufficient { --lv: #8a94a6; }
        .badge-lv {
            display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 600;
            color: var(--lv); background: color-mix(in srgb, var(--lv) 16%, transparent); border: 1px solid color-mix(in srgb, var(--lv) 40%, transparent);
        }

        /* Biểu đồ theo môn */
        .subj { padding: 14px 0; border-top: 1px solid var(--border-color); }
        .subj:first-of-type { border-top: 0; padding-top: 0; }
        .subj-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        .subj-name { font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .subj-pct { font-weight: 700; color: var(--lv); }
        .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
        .bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--lv) 70%, #fff 0%), var(--lv)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
        .subj-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: .82rem; color: var(--text-secondary); }
        .subj-actions a { color: #7fb0ff; font-weight: 600; text-decoration: none; margin-left: 14px; }
        .subj-actions a:hover { text-decoration: underline; }
        .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; font-size: .75rem; color: var(--text-secondary); }
        .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--lv); }

        /* Biểu đồ 7 ngày */
        .days { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding-top: 10px; }
        .day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
        .day-col { width: 100%; max-width: 38px; display: flex; flex-direction: column-reverse; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.05); }
        .day-col .ok { background: #2ecc71; } .day-col .bad { background: #ff5b5b; }
        .day-n { font-size: .75rem; font-weight: 600; color: var(--text-primary); }
        .day-l { font-size: .7rem; color: var(--text-secondary); }
        .chips { display: flex; gap: 10px; flex-wrap: wrap; }
        .chip { flex: 1 1 180px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--border-color); }
        .chip b { color: var(--lv); font-size: 1.3rem; }

        /* Gợi ý */
        .tips { list-style: none; display: grid; gap: 10px; }
        .tip { display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--lv) 10%, transparent); border: 1px solid color-mix(in srgb, var(--lv) 30%, transparent); line-height: 1.5; }
        .tip i { font-size: 1.4rem; color: var(--lv); flex-shrink: 0; margin-top: 1px; }
        .tip-danger { --lv: #ff5b5b; } .tip-warn { --lv: #ff9f43; } .tip-good { --lv: #2ecc71; } .tip-info { --lv: #3a7bfd; }

        /* Câu cần ôn */
        .rv { border: 1px solid var(--border-color); border-radius: 14px; background: rgba(255,255,255,.03); margin-top: 10px; overflow: hidden; }
        .rv summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
        .rv summary::-webkit-details-marker { display: none; }
        .rv summary:hover { background: rgba(255,255,255,.04); }
        .rv-q { flex: 1; white-space: pre-wrap; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
        .rv-meta { display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
        .tag { padding: 2px 9px; border-radius: 999px; font-size: .72rem; background: rgba(58,123,253,.18); color: #9cc0ff; }
        .tag-red { background: rgba(255,91,91,.18); color: #ff9a9a; }
        .rv-body { padding: 0 16px 16px; }
        .rv-opt { padding: 8px 12px; border-radius: 10px; margin-top: 6px; background: rgba(255,255,255,.05); }
        .rv-opt.right { background: rgba(46,204,113,.18); border: 1px solid rgba(46,204,113,.45); font-weight: 600; }
        .rv-exp { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,159,67,.1); border: 1px solid rgba(255,159,67,.3); white-space: pre-wrap; }
        .rv-actions { margin-top: 12px; }
        .rv-actions a { color: #7fb0ff; font-weight: 600; text-decoration: none; }

        .dash-empty { text-align: center; padding: 50px 20px; }
        .dash-empty i { font-size: 4rem; color: var(--primary-color); }
        .dash-empty p { color: var(--text-secondary); margin: 8px 0 20px; }
        .dash-loading { text-align: center; padding: 60px; color: var(--text-secondary); }
        .katex { font-size: 1.05em; }
    </style>
</head>
<div id="chat-widget">
    <div id="chat-bubble"><i class="bx bx-message-rounded-dots"></i></div>
    <div id="chat-box">
        <div id="chat-header">
            <span>🤖 AI Học Tập</span>
            <button id="chat-close">&times;</button>
        </div>
        <div id="chat-messages">
            </div>
        <div id="typing-indicator" style="display:none;" class="bot-msg">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Nhập câu hỏi, bài tập..." />
            <button id="chat-send"><i class="bx bx-send"></i></button>
        </div>
    </div>
</div>

<style>
    /* === SỬA ĐỔI: Chat Widget Styles === */
    #chat-widget {
        position: fixed;
        bottom: 20px;
        right: 25px;
        z-index: 1500;
    }

    #chat-bubble {
        width: 60px;
        height: 60px;
        background: var(--primary-color);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 1.8rem;
        cursor: pointer;
        box-shadow: 0 4px 12px var(--shadow-color);
        transition: transform 0.2s, background 0.3s;
    }
    #chat-bubble:hover { 
        transform: scale(1.1); 
        background: #5b92ff;
    }

    #chat-box {
        display: none;
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px; /* Tăng chiều rộng */
        height: 450px; /* Tăng chiều cao */
        background: var(--surface-color);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 8px 24px var(--shadow-color);
        overflow: hidden;
        display: flex; /* Dùng flex để bố cục bên trong */
        flex-direction: column;
        animation: fadeInUp 0.3s ease;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #chat-header {
        background: var(--primary-color);
        color: white;
        padding: 12px 15px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0; /* Không co lại */
    }

    #chat-header span {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    #chat-close {
        background: none;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        transition: color 0.2s;
    }
    #chat-close:hover { color: var(--danger-color); }

    #chat-messages {
        flex-grow: 1; /* Cho phép mở rộng chiều cao */
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background-color: rgba(0, 0, 0, 0.1); /* Màu nền nhẹ cho khu vực tin nhắn */
    }

    .chat-msg {
        padding: 10px 14px;
        border-radius: 18px;
        line-height: 1.4;
        max-width: 85%;
        word-wrap: break-word;
        font-size: 0.95rem;
    }

    .user-msg {
        align-self: flex-end;
        background: var(--primary-color);
        color: white;
        border-bottom-right-radius: 4px;
    }

    .bot-msg {
        align-self: flex-start;
        background: var(--surface-hover); /* Màu nền tối hơn, nổi bật hơn */
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-bottom-left-radius: 4px;
    }

    #chat-input-area {
        display: flex;
        border-top: 1px solid var(--border-color);
        flex-shrink: 0;
    }

    #chat-input {
        flex: 1;
        padding: 15px;
        background: transparent;
        border: none;
        color: var(--text-primary);
        outline: none;
        font-size: 1rem;
    }

    #chat-send {
        background: var(--primary-color);
        border: none;
        color: white;
        padding: 10px 15px;
        cursor: pointer;
        font-size: 1.2rem;
        transition: background 0.2s;
    }
    #chat-send:hover {
        background: #5b92ff;
    }

    /* === HIỆU ỨNG 3 CHẤM (TYPING INDICATOR) === */
    #typing-indicator {
        align-self: flex-start;
        display: flex;
        align-items: center;
        padding: 10px 14px;
        border-radius: 18px;
        border-bottom-left-radius: 4px;
        background: var(--surface-hover);
        width: fit-content;
        margin: 10px 0;
    }

    .typing-dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: var(--text-primary);
        border-radius: 50%;
        margin: 0 2px;
        opacity: 0;
        animation: typing 1s infinite;
    }

    .typing-dots span:nth-child(1) {
        animation-delay: 0s;
    }
    .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }
    .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0% { transform: translateY(0); opacity: 0.5; }
        25% { transform: translateY(-4px); opacity: 1; }
        50% { transform: translateY(0); opacity: 0.5; }
        100% { transform: translateY(0); opacity: 0.5; }
    }
</style>

<script>
    // === SỬA ĐỔI: Chat Logic ===
    const chatBubble = document.getElementById("chat-bubble");
    const chatBox = document.getElementById("chat-box");
    const chatClose = document.getElementById("chat-close");
    const chatSend = document.getElementById("chat-send");
    const chatInput = document.getElementById("chat-input");
    const chatMessages = document.getElementById("chat-messages");
    const typingIndicator = document.getElementById("typing-indicator"); // Thêm indicator

    // Khởi tạo trạng thái ban đầu (Ẩn chat box, hiển thị bubble)
    chatBox.style.display = "none";
    chatBubble.style.display = "flex";

    chatBubble.addEventListener("click", () => {
        chatBox.style.display = "flex";
        chatBubble.style.display = "none";
        chatInput.focus();
    });

    chatClose.addEventListener("click", () => {
        chatBox.style.display = "none";
        chatBubble.style.display = "flex";
    });

    function addMessage(text, sender = "bot") {
        const msg = document.createElement("div");
        msg.classList.add("chat-msg", sender === "user" ? "user-msg" : "bot-msg");
        msg.textContent = text;
        chatMessages.appendChild(msg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatSend.addEventListener("click", sendMessage);
    chatInput.addEventListener("keypress", e => {
        if (e.key === "Enter") sendMessage();
    });

    function showTypingIndicator() {
        typingIndicator.style.display = "flex";
        chatMessages.appendChild(typingIndicator); // Đảm bảo nó ở dưới cùng
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTypingIndicator() {
        typingIndicator.style.display = "none";
        if (typingIndicator.parentNode) {
            typingIndicator.parentNode.removeChild(typingIndicator); // Xóa khỏi DOM sau khi dùng
        }
    }

    function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        addMessage(text, "user");
        chatInput.value = "";
        showTypingIndicator(); // Bắt đầu hiển thị 3 chấm

        fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        })
            .then(res => res.json())
            .then(data => {
                hideTypingIndicator(); // Ẩn 3 chấm
                addMessage(data.reply || "⚠️ Không có phản hồi từ AI. Vui lòng kiểm tra kết nối server.", "bot");
            })
            .catch(() => {
                hideTypingIndicator(); // Ẩn 3 chấm ngay cả khi có lỗi
                addMessage("⚠️ Lỗi kết nối đến AI server.", "bot");
            });
    }
</script>

    <script>
        // === Quản lý Modal (Popup) ===
        const modalOverlay = document.getElementById('modal-overlay');
        const allModals = document.querySelectorAll('.modal');

        function openModal(modal) {
            if (modal == null) return;
            modal.classList.add('show');
            modalOverlay.classList.add('show');
        }

        function closeModal(modal) {
            if (modal == null) return;
            modal.classList.remove('show');
            modalOverlay.classList.remove('show');
        }

        document.querySelectorAll('.btn-close-modal').forEach(button => {
            button.addEventListener('click', () => {
                const modal = button.closest('.modal');
                closeModal(modal);
            });
        });

        // === Menu mobile ===
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            modalOverlay.classList.toggle('show');
        });

        // === Hợp nhất quản lý sự kiện click trên Overlay (Đã sửa) ===
        modalOverlay.addEventListener('click', () => {
            // 1. Đóng tất cả các modal đang mở
            allModals.forEach(modal => {
                if (modal.classList.contains('show')) {
                    closeModal(modal);
                }
            });

            // 2. Nếu sidebar trên mobile đang mở thì cũng đóng nó
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                modalOverlay.classList.remove('show');
            }
        });

        // === Phần Logout ===
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            alert('Đăng xuất thành công!');
            window.location.href = '1.html';
        });

        // === Phần Avatar và menu ===
        const avatar = document.getElementById('avatar');
        const upload = document.getElementById('upload');
        const avatarMenu = document.getElementById('avatarMenu');
        const defaultAvatar = 'default-avatar.png';

        avatar.addEventListener('click', (e) => {
            e.stopPropagation();
            openModal(avatarMenu);
        });

        document.getElementById('viewProfile').addEventListener('click', () => {
            window.location.href = 'profile.html';
        });

        document.getElementById('viewAvatar').addEventListener('click', () => {
            const avatarViewer = document.getElementById('avatarViewer');
            document.getElementById('avatarLarge').src = avatar.src;
            closeModal(avatarMenu);
            openModal(avatarViewer);
        });
        
        document.getElementById('changeAvatar').addEventListener('click', () => {
            upload.click();
            closeModal(avatarMenu);
        });

        document.getElementById('deleteAvatar').addEventListener('click', () => {
            avatar.src = defaultAvatar;
            localStorage.removeItem('userAvatar');
            closeModal(avatarMenu);
        });

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                avatar.src = reader.result;
                localStorage.setItem('userAvatar', reader.result);
            };
            reader.readAsDataURL(file);
        });

        window.addEventListener('load', () => {
            const savedAvatar = localStorage.getItem('userAvatar');
            avatar.src = savedAvatar ? savedAvatar : defaultAvatar;
        });

        // === Phần Streak Counter ===
        const streakKey = "loginStreak";
        const lastLoginKey = "lastLoginDate";
        let streak = parseInt(localStorage.getItem(streakKey)) || 0;
        let lastLogin = localStorage.getItem(lastLoginKey);
        const today = new Date().toDateString();

        function daysBetween(date1Str, date2Str) {
            const d1 = new Date(date1Str);
            const d2 = new Date(date2Str);
            const diffTime = d2.setHours(0,0,0,0) - d1.setHours(0,0,0,0);
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }

        if (lastLogin !== today) {
            if (lastLogin && daysBetween(lastLogin, today) === 1) {
                streak++;
            } else {
                streak = 1;
            }
            localStorage.setItem(streakKey, streak);
            localStorage.setItem(lastLoginKey, today);
        }
        document.getElementById("streak-count").textContent = streak;
        
        // === Phần Menu Môn Học ===
        document.getElementById('homeworkBtn').addEventListener('click', () => {
  window.location.href = 'baitapvn.html';
});

                    alert(`Chuyển đến trang bài tập môn ${btn.textContent}...`);
                    window.location.href = `${subject}.html`;
                }
                closeModal(subjectMenu);
            });
        });
        
        // === Hiệu ứng Loading Screen MỚI ===
        window.addEventListener('load', () => {
            const loaderWrapper = document.getElementById('loader-wrapper');
            // Đặt một độ trễ nhỏ (ví dụ 300ms) để đảm bảo người dùng kịp thấy hiệu ứng
            setTimeout(() => {
                if (loaderWrapper) {
                    loaderWrapper.classList.add('hidden');
                }
            }, 300); 
        });
    </script>
    <!-- Bảng phân tích điểm yếu (đọc dữ liệu từ /api/question-bank/stats/me) -->
    <script>
    (function () {
        const LEVEL_TEXT = { weak: 'Yếu', improve: 'Cần cải thiện', good: 'Tốt', insufficient: 'Chưa đủ dữ liệu' };
        const TIP_ICON = { danger: 'bx-error-circle', warn: 'bx-trending-up', good: 'bx-check-circle', info: 'bx-info-circle' };
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const body = document.getElementById('dashBody');
        const link = (params) => 'nganhangcauhoi.html' + (params ? '?' + new URLSearchParams(params) : '');

        const MATH_OPTS = {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
        };
        function renderMath(el, tries = 0) {
            if (window.renderMathInElement) { try { renderMathInElement(el, MATH_OPTS); } catch (e) { console.error(e); } }
            else if (tries < 20) setTimeout(() => renderMath(el, tries + 1), 250);
        }

        function ringColor(acc) { return acc < 50 ? '#ff5b5b' : acc < 75 ? '#ff9f43' : '#2ecc71'; }

        function renderEmpty() {
            body.innerHTML = `<div class="card dash-empty">
                <i class='bx bx-bar-chart-alt-2'></i>
                <h3 style="justify-content:center;font-size:1.3rem">Chưa có dữ liệu phân tích</h3>
                <p>Làm vài câu trong Ngân hàng câu hỏi, hệ thống sẽ tự chỉ ra môn nào bạn đang yếu và cần ôn lại.</p>
                <a href="${link()}" class="dash-btn"><i class='bx bx-play-circle'></i> Bắt đầu làm bài</a>
            </div>`;
        }

        function renderError(msg, loginNeeded) {
            body.innerHTML = `<div class="card dash-empty">
                <i class='bx bx-error' style="color:var(--danger-color)"></i>
                <p>${esc(msg)}</p>
                ${loginNeeded
                    ? `<a href="1.html" class="dash-btn">Đăng nhập lại</a>`
                    : `<a href="#" class="dash-btn" onclick="location.reload();return false;">Thử lại</a>`}
            </div>`;
        }

        function renderStats(d) {
            const o = d.overall;
            const needWork = d.bySubject.filter((s) => s.level === 'weak' || s.level === 'improve').length;
            const rc = ringColor(o.accuracy);
            const C = 2 * Math.PI * 42;

            const kpis = `<div class="dash-grid kpi-row">
                <div class="card kpi">
                    <div class="ring">
                        <svg width="96" height="96" viewBox="0 0 96 96">
                            <circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>
                            <circle cx="48" cy="48" r="42" fill="none" stroke="${rc}" stroke-width="9" stroke-linecap="round"
                                stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - o.accuracy / 100)).toFixed(1)}"/>
                        </svg>
                        <div class="ring-val">${o.accuracy}%</div>
                    </div>
                    <div><div class="kpi-label" style="margin:0;font-size:.95rem;color:var(--text-primary);font-weight:600">Độ chính xác</div>
                        <div class="kpi-label">${o.correct}/${o.attempts} lượt đúng</div></div>
                </div>
                <div class="card kpi">
                    <div class="kpi-icon" style="background:rgba(58,123,253,.18);color:#7fb0ff"><i class='bx bx-task'></i></div>
                    <div><div class="kpi-num">${o.attempts}</div><div class="kpi-label">Lượt đã làm</div></div>
                </div>
                <div class="card kpi">
                    <div class="kpi-icon" style="background:rgba(255,159,67,.18);color:#ff9f43"><i class='bx bx-trending-up'></i></div>
                    <div><div class="kpi-num">${needWork}</div><div class="kpi-label">Môn cần cải thiện</div></div>
                </div>
                <div class="card kpi">
                    <div class="kpi-icon" style="background:rgba(255,91,91,.18);color:#ff5b5b"><i class='bx bx-revision'></i></div>
                    <div><div class="kpi-num">${d.reviewTotal}</div><div class="kpi-label">Câu cần ôn lại</div>
                        ${d.reviewTotal ? `<a class="kpi-link" href="${link({ wrong: 1 })}">Ôn ngay →</a>` : ''}</div>
                </div>
            </div>`;

            const subjects = d.bySubject.map((s) => `
                <div class="subj lv-${s.level}">
                    <div class="subj-top">
                        <div class="subj-name">${esc(s.subject)} <span class="badge-lv">${LEVEL_TEXT[s.level]}</span></div>
                        <div class="subj-pct">${s.level === 'insufficient' ? '—' : s.accuracy + '%'}</div>
                    </div>
                    <div class="bar"><span style="width:${Math.max(s.accuracy, 2)}%"></span></div>
                    <div class="subj-foot">
                        <span>${s.correct}/${s.attempts} lượt đúng${s.wrongNow ? ` · <b style="color:#ff9a9a">${s.wrongNow} câu cần ôn</b>` : ''}</span>
                        <span class="subj-actions">
                            ${s.wrongNow ? `<a href="${link({ subject: s.subject, wrong: 1 })}">Ôn câu sai</a>` : ''}
                            <a href="${link({ subject: s.subject })}">Luyện thêm</a>
                        </span>
                    </div>
                </div>`).join('');

            const t = d.thresholds;
            const subjCard = `<div class="card">
                <h3><i class='bx bx-bar-chart-alt-2'></i> Phân tích theo môn</h3>
                <div class="sub">Môn yếu nhất xếp trên cùng. Mỗi môn cần ít nhất ${t.minAttempts} lượt để được đánh giá.</div>
                ${subjects}
                <div class="legend">
                    <span class="lv-weak"><i></i>Yếu (dưới ${t.weakBelow}%)</span>
                    <span class="lv-improve"><i></i>Cần cải thiện (dưới ${t.improveBelow}%)</span>
                    <span class="lv-good"><i></i>Tốt</span>
                    <span class="lv-insufficient"><i></i>Chưa đủ dữ liệu</span>
                </div>
            </div>`;

            const maxN = Math.max(1, ...d.daily.map((x) => x.attempts));
            const days = d.daily.map((x) => {
                const h = x.attempts ? Math.max(8, Math.round((x.attempts / maxN) * 130)) : 4;
                const okH = x.attempts ? Math.round((x.correct / x.attempts) * 100) : 0;
                return `<div class="day" title="${x.label}: ${x.correct}/${x.attempts} lượt đúng">
                    <div class="day-n">${x.attempts || ''}</div>
                    <div class="day-col" style="height:${h}px">
                        <div class="ok" style="height:${okH}%"></div><div class="bad" style="height:${x.attempts ? 100 - okH : 0}%"></div>
                    </div>
                    <div class="day-l">${x.label}</div>
                </div>`;
            }).join('');
            const dayCard = `<div class="card">
                <h3><i class='bx bx-calendar-check'></i> 7 ngày gần đây</h3>
                <div class="sub">Số câu làm mỗi ngày (<span style="color:#2ecc71">xanh: đúng</span>, <span style="color:#ff5b5b">đỏ: sai</span>)</div>
                <div class="days">${days}</div>
            </div>`;

            const types = `<div class="card" style="margin-bottom:20px">
                <h3><i class='bx bx-category'></i> Theo dạng câu hỏi</h3>
                <div class="sub">Bạn làm tốt dạng nào, chưa tốt dạng nào</div>
                <div class="chips">${d.byType.map((x) => `
                    <div class="chip lv-${x.level}">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                            <span style="font-weight:600">${esc(x.label)}</span><span class="badge-lv">${LEVEL_TEXT[x.level]}</span>
                        </div>
                        <div style="margin-top:8px"><b>${x.level === 'insufficient' ? '—' : x.accuracy + '%'}</b>
                            <span style="color:var(--text-secondary);font-size:.82rem"> · ${x.correct}/${x.attempts} lượt</span></div>
                    </div>`).join('')}</div>
            </div>`;

            const tips = `<div class="card" style="margin-bottom:20px">
                <h3><i class='bx bx-bulb'></i> Gợi ý cải thiện</h3>
                <div class="sub">Dựa trên kết quả làm bài của bạn</div>
                <ul class="tips">${d.suggestions.map((x) => `
                    <li class="tip tip-${x.tone}"><i class='bx ${TIP_ICON[x.tone] || 'bx-info-circle'}'></i><div>${esc(x.text)}
                        ${x.subject ? `<div style="margin-top:6px"><a class="kpi-link" href="${link({ subject: x.subject })}">Luyện môn ${esc(x.subject)} →</a></div>` : ''}</div></li>`).join('')}
                </ul>
            </div>`;

            let review = '';
            if (d.review.length) {
                review = `<div class="card" id="reviewCard">
                    <h3><i class='bx bx-revision'></i> Câu cần ôn lại (${d.reviewTotal})</h3>
                    <div class="sub">Những câu lần làm gần nhất của bạn bị sai${d.reviewTotal > d.review.length ? `, đang hiện ${d.review.length} câu sai nhiều nhất` : ''}. Bấm vào để xem đáp án và giải thích.</div>
                    ${d.review.map((r) => {
                        let ans;
                        if (r.type === 'shortanswer') {
                            ans = `<div class="rv-opt right">Đáp án đúng: ${esc(r.correctAnswer)}</div>`;
                        } else {
                            ans = r.options.map((op, i) => `<div class="rv-opt ${i === Number(r.correctAnswer) ? 'right' : ''}">
                                <b>${String.fromCharCode(65 + i)}.</b> ${esc(op)}${i === Number(r.correctAnswer) ? ' ✓' : ''}</div>`).join('');
                        }
                        return `<details class="rv">
                            <summary>
                                <div class="rv-q">${esc(r.question)}</div>
                                <div class="rv-meta"><span class="tag">${esc(r.subject)}</span>
                                    <span class="tag tag-red">Sai ${r.wrongCount} lần</span></div>
                            </summary>
                            <div class="rv-body">${ans}
                                ${r.explanation ? `<div class="rv-exp"><b>💡 Giải thích:</b> ${esc(r.explanation)}</div>` : ''}
                                <div class="rv-actions"><a href="${link({ subject: r.subject, wrong: 1 })}">Làm lại các câu sai môn ${esc(r.subject)} →</a></div>
                            </div>
                        </details>`;
                    }).join('')}
                </div>`;
            }

            body.innerHTML = kpis + `<div class="dash-grid two-col">${subjCard}${dayCard}</div>` + types + tips + review;
            renderMath(body);
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/question-bank/stats/me');
                if (res.status === 401) return renderError('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại để xem phân tích.', true);
                const data = await res.json().catch(() => ({}));
                if (!res.ok) return renderError(data.message || 'Không tải được dữ liệu phân tích.');
                if (!data.overall.attempts) return renderEmpty();
                renderStats(data);
            } catch (e) {
                renderError('Không kết nối được tới máy chủ.');
            }
        }
        loadDashboard();
    })();
    </script>

</body>
