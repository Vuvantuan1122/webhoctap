<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nộp bài tập | NT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="hw.css">
</head>
<body data-active="homework">
<main>
  <div class="wrap" style="max-width:820px">
    <div class="page-head">
      <div>
        <h1>Nộp bài tập</h1>
        <p>Chụp ảnh bài làm, nộp và nhận ngay nhận xét lỗi sai</p>
      </div>
      <div class="tabs">
        <a href="bai tap.html" class="on"><i class='bx bx-upload'></i> Nộp bài</a>
        <a href="baitapvn.html"><i class='bx bx-folder-open'></i> Bài đã nộp</a>
      </div>
    </div>

    <div class="panel">
      <h2><span class="step">1</span> Chọn lớp học</h2>
      <select id="cls" class="hw-sel"><option value="">Đang tải lớp học…</option></select>
    </div>

    <div class="panel">
      <h2><span class="step">2</span> Tải bài làm lên</h2>
      <div class="drop" id="drop"><i class="fas fa-cloud-arrow-up"></i>
        <p>Kéo thả ảnh/PDF vào đây hoặc <b style="color:#7fb0ff">chọn tệp</b></p>
        <p style="font-size:.8rem">Tối đa 10 tệp · ảnh nên rõ nét, đủ sáng</p></div>
      <input type="file" id="file" multiple accept="image/*,.pdf" hidden>
      <div class="prev" id="prev"></div>
      <div class="acts" style="justify-content:flex-end">
        <button class="btn btn-r" id="clr"><i class='bx bx-trash'></i> Xóa tất cả</button>
        <button class="btn btn-p" id="send"><i class='bx bx-send'></i> <span>Gửi bài</span></button>
      </div>
    </div>

    <div class="panel">
      <h2><span class="step">3</span> Bài đã nộp &amp; nhận xét</h2>
      <div id="done"><div class="empty">Chọn lớp để xem bài đã nộp.</div></div>
    </div>
  </div>
</main>

<script src="shell.js"></script>
<script src="hw.js"></script>
<script>
const $ = id => document.getElementById(id);
let files = [], mine = [], me = null;

(async () => {
  try { const r = await fetch('/me'); if (r.ok) me = await r.json(); } catch {}
  try {
    const r = await fetch('/api/classrooms/my'); const c = await r.json();
    if (!r.ok || !c.length) { $('cls').innerHTML = '<option value="">Không tìm thấy lớp học</option>'; return; }
    $('cls').innerHTML = '<option value="">— Chọn lớp học của bạn —</option>' + c.map(x => `<option value="${HW.esc(x._id)}">${HW.esc(x.name)}</option>`).join('');
  } catch { $('cls').innerHTML = '<option value="">Lỗi tải lớp học</option>'; }
})();

function addFiles(list) {
  [...list].forEach(f => {
    if (!(f.type.startsWith('image/') || f.type === 'application/pdf')) return HW.toast(`"${f.name}" không phải ảnh/PDF`);
    if (files.some(x => x.name === f.name && x.size === f.size)) return HW.toast(`"${f.name}" đã được chọn`);
    if (files.length >= 10) return HW.toast('Tối đa 10 tệp mỗi lần nộp');
    files.push(f);
  });
  drawPrev();
}
function drawPrev() {
  $('prev').innerHTML = files.map((f, i) => `<div class="it">${f.type === 'application/pdf' ? '<div class="pdf"><i class="fas fa-file-pdf"></i></div>' : `<img src="${URL.createObjectURL(f)}" alt="">`}<small>${HW.esc(f.name)}</small><button class="x" data-i="${i}">×</button></div>`).join('');
}
$('prev').onclick = e => { const b = e.target.closest('.x'); if (b) { files.splice(+b.dataset.i, 1); drawPrev(); } };
$('drop').onclick = () => $('file').click();
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('over'); addFiles(e.dataTransfer.files); };
$('clr').onclick = () => { if (files.length && confirm('Xóa tất cả tệp đã chọn?')) { files = []; drawPrev(); } };

$('send').onclick = async () => {
  if (!$('cls').value) return HW.toast('⚠️ Hãy chọn lớp học trước');
  if (!files.length) return HW.toast('⚠️ Hãy chọn ít nhất một tệp');
  const b = $('send'); b.disabled = true; b.querySelector('span').textContent = 'Đang gửi…';
  const fd = new FormData(); files.forEach(f => fd.append('images', f)); fd.append('classId', $('cls').value);
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd }); const d = await r.json();
    if (!r.ok) throw new Error(d.message || d.error || 'Không thể nộp bài');
    HW.toast('✅ Nộp bài thành công! Bấm vào bài để nhờ AI nhận xét.'); files = []; drawPrev(); loadMine();
  } catch (e) { HW.toast('❌ ' + e.message); }
  b.disabled = false; b.querySelector('span').textContent = 'Gửi bài';
};

async function loadMine() {
  const id = $('cls').value; if (!id) { mine = []; return drawDone(); }
  try { const r = await fetch('/api/images?classId=' + encodeURIComponent(id)); const d = await r.json(); mine = r.ok ? d.filter(s => !me || s.userId === me.username) : []; }
  catch { mine = []; }
  drawDone();
}
function drawDone() {
  $('done').innerHTML = !$('cls').value ? '<div class="empty">Chọn lớp để xem bài đã nộp.</div>' : !mine.length ? '<div class="empty">Bạn chưa nộp bài nào cho lớp này.</div>' :
    mine.map(s => `<div class="srow" data-id="${s.id}"><div class="t" style="${HW.thumb(s.url)}">${HW.isPdf(s.url) ? '<i class="fas fa-file-pdf"></i>' : ''}</div>
      <div class="m"><b>${HW.esc(s.fileName || 'Bài nộp')}</b><span>${HW.fmt(s.timestamp)}</span><div style="margin-top:4px">${HW.tag(s.feedback)}${s.feedback ? ` <span style="font-size:.78rem;color:var(--text-secondary)">· ${s.feedback.mistakes?.length || 0} lỗi cần sửa</span>` : ''}</div></div>
      <i class="fas fa-chevron-right" style="color:var(--text-secondary)"></i></div>`).join('');
}
$('done').onclick = e => { const r = e.target.closest('.srow'); if (r) HW.open(mine.find(x => x.id === r.dataset.id), { role: 'student', onChange: drawDone }); };
$('cls').onchange = loadMine;
</script>
</body>
</html>
