<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài tập về nhà | NT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="hw.css">
</head>
<body data-active="homework">
<main>
  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>Bài tập về nhà</h1>
        <p id="sub">Xem bài đã nộp và nhận xét lỗi sai</p>
      </div>
      <div class="tabs">
        <a href="bai tap.html"><i class='bx bx-upload'></i> Nộp bài</a>
        <a href="baitapvn.html" class="on"><i class='bx bx-folder-open'></i> Bài đã nộp</a>
      </div>
    </div>

    <div class="panel filters">
      <select id="classFilter" class="hw-sel"><option value="">Đang tải lớp học…</option></select>
      <select id="statusFilter" class="hw-sel">
        <option value="all">Tất cả trạng thái</option>
        <option value="none">Chưa nhận xét</option>
        <option value="done">Đã nhận xét</option>
      </select>
    </div>

    <div class="kpi-row" id="stats" style="display:none">
      <div class="card kpi"><div class="kpi-icon" style="background:rgba(58,123,253,.18);color:#7fb0ff"><i class='bx bx-file'></i></div>
        <div><div class="kpi-num" id="kTotal">0</div><div class="kpi-label">Bài đã nộp</div></div></div>
      <div class="card kpi"><div class="kpi-icon" style="background:rgba(46,204,113,.18);color:#2ecc71"><i class='bx bx-check-circle'></i></div>
        <div><div class="kpi-num" id="kDone">0</div><div class="kpi-label">Đã nhận xét</div></div></div>
      <div class="card kpi"><div class="kpi-icon" style="background:rgba(255,159,67,.18);color:#ff9f43"><i class='bx bx-time-five'></i></div>
        <div><div class="kpi-num" id="kPending">0</div><div class="kpi-label">Chưa nhận xét</div></div></div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="msg" class="card empty"><i class='bx bx-book-content'></i><span id="msgText">Vui lòng chọn lớp học để xem bài nộp.</span></div>
  </div>
</main>

<script src="shell.js"></script>
<script src="hw.js"></script>
<script>
let me = null, subs = [];
const $ = id => document.getElementById(id);
const isTeacher = () => me && me.role === 'teacher';
const setMsg = t => { $('msg').style.display = ''; $('msgText').textContent = t; };

async function init() {
  try { const r = await fetch('/me'); if (r.ok) me = await r.json(); } catch {}
  if (!isTeacher()) $('sub').textContent = 'Xem bài đã nộp của bạn và lời nhận xét từ thầy cô / AI';
  try {
    const r = await fetch('/api/classrooms/my'); if (!r.ok) throw 0;
    const cls = await r.json();
    $('classFilter').innerHTML = '<option value="">— Chọn lớp học —</option><option value="all">Tất cả các lớp</option>' +
      cls.map(c => `<option value="${HW.esc(c._id)}">${HW.esc(c.name)}</option>`).join('');
  } catch { $('classFilter').innerHTML = '<option value="">Lỗi tải lớp (hãy đăng nhập lại)</option>'; }
}

async function load() {
  const id = $('classFilter').value;
  if (!id) { subs = []; render(); return; }
  setMsg('Đang tải bài nộp…'); $('grid').innerHTML = '';
  try {
    const r = await fetch('/api/images?classId=' + encodeURIComponent(id));
    const d = await r.json(); if (!r.ok) throw new Error(d.message || 'Lỗi ' + r.status);
    subs = d;
  } catch (e) { subs = []; setMsg('❌ ' + e.message); return; }
  render();
}

function render() {
  const f = $('statusFilter').value;
  const list = subs.filter(s => f === 'all' || (f === 'done' ? s.feedback : !s.feedback));
  const done = subs.filter(s => s.feedback).length;
  $('stats').style.display = subs.length ? '' : 'none';
  $('kTotal').textContent = subs.length; $('kDone').textContent = done; $('kPending').textContent = subs.length - done;
  if (list.length) $('msg').style.display = 'none';
  else setMsg(subs.length ? 'Không có bài nào khớp bộ lọc.' : ($('classFilter').value ? 'Chưa có bài nào được nộp cho lớp này.' : 'Vui lòng chọn lớp học để xem bài nộp.'));
  $('grid').innerHTML = list.map(s => `<div class="sub" data-id="${s.id}">
    <div class="th" style="${HW.thumb(s.url)}">${HW.isPdf(s.url) ? '<i class="fas fa-file-pdf"></i>' : ''}</div>
    <div class="bd"><div class="who">${HW.esc(s.userId)}</div><div class="when">${HW.fmt(s.timestamp)}</div>${HW.tag(s.feedback)}
    ${s.feedback ? `<div class="when">${s.feedback.mistakes?.length || 0} lỗi cần sửa${s.feedback.score != null ? ' · ' + s.feedback.score + '/10' : ''}</div>` : ''}</div></div>`).join('');
}

$('grid').onclick = e => {
  const c = e.target.closest('.sub'); if (!c) return;
  const s = subs.find(x => String(x.id) === c.dataset.id);
  HW.open(s, { role: isTeacher() ? 'teacher' : 'student', onChange: render });
};
$('classFilter').onchange = load; $('statusFilter').onchange = render;
init();
</script>
</body>
</html>
