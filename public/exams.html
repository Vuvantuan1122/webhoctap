<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách đề thi</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f2f5; /* Một màu xám rất nhạt, dễ chịu cho mắt */
    }

    .page-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 3rem 0;
      border-radius: 0 0 30px 30px;
      margin-bottom: 3rem;
    }

    .page-header h1 {
      font-weight: 700;
    }

    /* Tùy chỉnh thẻ đề thi */
    .exam-card {
      border: none;
      border-radius: 15px; /* Bo góc nhiều hơn */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease-in-out;
      overflow: hidden; /* Đảm bảo nội dung bên trong cũng được bo góc */
    }

    .exam-card:hover {
      transform: translateY(-8px); /* Hiệu ứng nhấc thẻ lên khi di chuột */
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    
    .card-body {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .card-title {
        font-weight: 600;
        color: #333;
    }

    .info-list li {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    
    .info-list .bi {
      color: #0d6efd; /* Màu xanh dương của Bootstrap */
      margin-right: 10px;
      font-size: 1.1rem;
    }
    
    .btn-start-exam {
        margin-top: auto; /* Luôn đẩy nút xuống cuối thẻ */
        font-weight: 600;
        padding: 0.75rem 1rem;
        border-radius: 10px;
    }

    .subject-badge {
      font-weight: 500;
      font-size: 0.85rem;
    }
    
    .no-exams-message {
        background-color: white;
        padding: 3rem;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>

  <header class="page-header text-center">
    <div class="container">
      <h1 class="display-5">📚 Danh sách đề thi</h1>
      <p class="lead">Chọn một đề thi bên dưới để bắt đầu làm bài.</p>
    </div>
  </header>

  <main class="container py-4">
    <div id="examList" class="row">
      </div>
  </main>
  
  <footer class="text-center text-muted py-4">
    <p>&copy; 2025 - Hệ thống thi trực tuyến</p>
  </footer>

  <script>
    async function loadExams() {
      try {
        // ✅ API MỚI: Lấy đề thi theo lớp học mà học sinh đang tham gia
        let res = await fetch("/api/exams/by-class"); 
        
        // Đoạn code dự phòng (chỉ dành cho giáo viên/admin)
        if (!res.ok) {
            console.warn("Lỗi tải đề thi theo lớp. Thử tải tất cả đề thi.");
            res = await fetch("/api/exams");
            if (!res.ok) {
              throw new Error(`HTTP error! status: ${res.status}`);
            }
        }
        
        let data = await res.json();

        let html = "";
        if (data && data.length > 0) {
            data.forEach(exam => {
                // ✅ HIỂN THỊ TÊN LỚP (TRƯỜNG className ĐÃ ĐƯỢC THÊM VÀO RESPONSE CỦA SERVER)
                const classHtml = exam.className ? 
                    `<li class="info-list">
                      <i class="bi bi-person-badge-fill"></i>
                      <span><b>Lớp học:</b> ${exam.className}</span>
                    </li>` : '';

                html += `
                  <div class="col-lg-4 col-md-6 col-sm-12 mb-4">
                    <div class="card exam-card h-100">
                      <div class="card-body p-4">
                        <div class="mb-3">
                            <span class="badge rounded-pill text-bg-primary subject-badge px-3 py-2">${exam.subject}</span>
                        </div>
                        <h5 class="card-title mb-3 flex-grow-1">${exam.title}</h5>
                        <ul class="list-unstyled text-secondary mb-4">
                          <li class="info-list">
                            <i class="bi bi-stopwatch-fill"></i>
                            <span><b>Thời gian:</b> ${exam.duration} phút</span>
                          </li>
                          <li class="info-list">
                            <i class="bi bi-person-check-fill"></i>
                            <span><b>GV ra đề:</b> ${exam.createdBy}</span>
                          </li>
                          ${classHtml} </ul>
                        <a href="thi.html?id=${exam._id}" class="btn btn-primary btn-start-exam w-100">
                          Vào thi <i class="bi bi-arrow-right-circle-fill ms-2"></i>
                        </a>
                      </div>
                    </div>
                  </div>`;
            });
        } else {
            html = `
              <div class="col-12">
                <div class="no-exams-message text-center">
                  <i class="bi bi-journal-x fs-1 text-warning"></i>
                  <h3 class="mt-3">Chưa có đề thi nào!</h3>
                  <p class="text-muted">Vui lòng quay lại sau để kiểm tra.</p>
                </div>
              </div>
            `;
        }

        document.getElementById("examList").innerHTML = html;
      } catch (error) {
        console.error("Lỗi khi tải đề thi:", error);
        document.getElementById("examList").innerHTML = `
          <div class="col-12">
            <div class="alert alert-danger text-center">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              Đã xảy ra lỗi khi tải danh sách đề thi. Vui lòng thử lại.
            </div>
          </div>
        `;
      }
    }

    loadExams();
  </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="account-menu.js"></script>
</body>
</html>
