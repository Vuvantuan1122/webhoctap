<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Học Tập</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        body { margin: 0; min-height: 100vh; font-family: 'Poppins', sans-serif; color: #f0f2f5;

<body>
    <!-- Khóa API nằm ở server (.env → GEMINI_API_KEY), widget gọi /api/chat -->

        window.addEventListener('load', () => setTimeout(() => window.AIChat && window.AIChat.open(), 300));
    </script>
