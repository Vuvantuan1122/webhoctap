<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lớp học | NT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="classes.css">
</head>
<body data-active="classes">
<main>
  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>Lớp học</h1>
        <p>Tham gia lớp bằng mã do giáo viên cung cấp và theo dõi trạng thái duyệt</p>
      </div>
    </div>

    <div class="grid-2">
      <div id="main-controls" class="card side-sticky">
        <h3><i class='bx bx-user-plus'></i> Gửi yêu cầu tham gia</h3>
        <p class="sub-t" id="user-info">Đang kiểm tra đăng nhập...</p>

        <label class="lb" for="joinCode">Mã lớp học (6 ký tự)</label>
        <input type="text" id="joinCode" class="inp" maxlength="6" placeholder="VD: A1B2C3" autocomplete="off">
        <button onclick="joinClassroom()" class="btn btn-p btn-block" id="joinBtn" style="margin-top:16px"><i class='bx bx-send'></i> <span>Gửi yêu cầu</span></button>
        <div id="join-message" class="message"></div>
      </div>

      <div id="my-classes-section" class="card">
        <h3><i class='bx bx-school'></i> Lớp đã tham gia / chờ duyệt</h3>
        <p class="sub-t">Danh sách lớp của bạn</p>
        <div id="my-classrooms" class="cls-grid"></div>
      </div>
    </div>
  </div>
</main>

<script src="shell.js"></script>
<script>
const API_URL = '/api';
const esc = Shell.esc;
const userData = JSON.parse(localStorage.getItem("userData") || "{}");
const isLoggedIn = localStorage.getItem("isLoggedIn");
let currentUser = null;

if (!isLoggedIn || !userData.role) {
  alert("⚠️ Bạn cần đăng nhập để truy cập trang này!");
  window.location.href = "1.html";
} else if (userData.role !== "student") {
  alert("🚫 Chỉ học sinh mới có quyền truy cập trang này!");
  window.location.href = "teacher-classes.html";
} else {
  document.getElementById("user-info").textContent = `Xin chào, ${userData.username}! (Tài khoản học sinh)`;
}

window.onload = () => {
  checkAuth().then(user => { currentUser = user; if (currentUser) loadMyClassrooms(); });
};

function showMessage(elementId, message, type) {
  const el = document.getElementById(elementId);
  el.innerHTML = message;
  el.className = `message ${type} show`;
  setTimeout(() => { if (el.classList.contains('show')) el.className = 'message'; }, 5000);
}

async function checkAuth() {
  const info = document.getElementById("user-info");
  try {
    const res = await fetch('/me', { credentials: "include" });
    if (res.status !== 200) {
      info.innerHTML = '❌ Bạn cần đăng nhập với vai trò <b>Học sinh</b>. <a href="1.html" style="color:#7fb0ff">Đăng nhập</a>';
      return null;
    }
    const user = await res.json();
    if (user.role !== "student") { info.textContent = "❌ Tài khoản của bạn không phải Học sinh."; return null; }
    info.innerHTML = `Đã đăng nhập: <b>${esc(user.username)}</b>`;
    return user;
  } catch (e) {
    info.textContent = "❌ Lỗi kết nối máy chủ.";
    return null;
  }
}

async function joinClassroom() {
  const joinCode = document.getElementById("joinCode").value.trim();
  const btn = document.getElementById("joinBtn");
  const label = btn.querySelector('span');
  btn.disabled = true; label.textContent = 'Đang gửi...';

  if (joinCode.length !== 6) {
    showMessage('join-message', 'Mã lớp phải có đúng 6 ký tự.', 'error');
    btn.disabled = false; label.textContent = 'Gửi yêu cầu';
    return;
  }
  try {
    const res = await fetch(`${API_URL}/classrooms/join`, {
      method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
      body: JSON.stringify({ joinCode })
    });
    const data = await res.json();
    if (res.ok) {
      showMessage('join-message', `✅ ${esc(data.message)}`, 'success');
      document.getElementById("joinCode").value = "";
      loadMyClassrooms();
    } else {
      showMessage('join-message', `❌ ${esc(data.message || "Không gửi được yêu cầu.")}`, 'error');
    }
  } catch (e) {
    showMessage('join-message', '❌ Lỗi kết nối máy chủ.', 'error');
  } finally {
    btn.disabled = false; label.textContent = 'Gửi yêu cầu';
  }
}
document.getElementById("joinCode").addEventListener('keydown', e => { if (e.key === 'Enter') joinClassroom(); });

async function loadMyClassrooms() {
  const listDiv = document.getElementById("my-classrooms");
  listDiv.innerHTML = '<div class="loader"></div>';
  try {
    const res = await fetch(`${API_URL}/classrooms/my`, { credentials: "include" });
    if (!res.ok) throw new Error("Không thể tải lớp học.");
    const classrooms = await res.json();

    if (!Array.isArray(classrooms) || classrooms.length === 0) {
      listDiv.innerHTML = '<div class="empty" style="grid-column:1/-1"><i class="bx bx-school"></i>Bạn chưa tham gia lớp học nào.<br>Hãy nhập mã lớp để tham gia!</div>';
      return;
    }
    listDiv.innerHTML = classrooms.map(c => {
      const approved = (c.students || []).includes(currentUser?.username);
      const pending = (c.pendingStudents || []).includes(currentUser?.username);
      const st = approved ? ['success', 'bx-check-circle', 'Đã duyệt']
               : pending ? ['pending', 'bx-time-five', 'Chờ duyệt']
               : ['error', 'bx-help-circle', 'Không rõ trạng thái'];
      return `<div class="class-card">
        <div class="top"><h4>${esc(c.name || "Không có tên lớp")}</h4><span class="join-code"><i class='bx bx-key'></i>${esc(c.joinCode || "N/A")}</span></div>
        <div class="meta">
          <div><i class='bx bx-user-voice'></i>Giáo viên: <b>${esc(c.teacherUsername || "Chưa rõ")}</b></div>
          <div><span class="badge ${st[0]}"><i class='bx ${st[1]}'></i>${st[2]}</span></div>
        </div></div>`;
    }).join('');
  } catch (error) {
    listDiv.innerHTML = `<div class="message error show" style="grid-column:1/-1">❌ Lỗi tải lớp: ${esc(error.message)}</div>`;
  }
}
</script>
</body>
</html>
