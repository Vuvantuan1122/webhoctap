<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài học | NT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .82rem; color: var(--text-secondary); margin-bottom: 16px; }
  .crumbs a { color: #9cc0ff; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs i { font-size: 1rem; }
  .crumbs .cur { color: var(--text-primary); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ls-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }

  /* ---------- Tiêu đề bài học ---------- */
  .ls-head { padding: 22px 24px; }
  .ls-kicker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .ls-head h1 { font-size: 1.6rem; line-height: 1.3; font-weight: 700; }
  .ls-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; color: var(--text-secondary); font-size: .84rem; }
  .ls-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .ls-meta i { color: var(--primary-color); font-size: 1.1rem; }

  /* ---------- Trình phát ---------- */
  .player-card { padding: 12px; }
  .player-box { border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; display: grid; place-items: center; }
  .player-box video, .player-box iframe { width: 100%; height: 100%; border: 0; background: #000; }
  .ph { text-align: center; color: var(--text-secondary); padding: 20px; }
  .ph i { font-size: 4rem; color: var(--primary-color); display: block; margin-bottom: 8px; }

  /* ---------- Thanh thao tác ---------- */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 18px; }
  .actions .mid { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  a.btn.off { opacity: .4; pointer-events: none; }

  /* ---------- Thông tin bài học ---------- */
  .info-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-top: 14px; }
  .info-it { padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--border-color); }
  .info-it b { display: block; font-size: .72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
  .info-it span { display: block; font-size: .92rem; margin-top: 4px; word-break: break-word; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tags .badge { font-size: .68rem; padding: 1px 8px; }

  .mini { display: grid; gap: 6px; margin-top: 12px; }
  .mini a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--text-primary); font-size: .86rem; border: 1px solid transparent; background: rgba(255,255,255,.04); }
  .mini a:hover { background: rgba(255,255,255,.08); }
  .mini a.playing { background: rgba(58,123,253,.22); border-color: rgba(58,123,253,.7); }
  .mini .no { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: rgba(58,123,253,.25); color: #cfe0ff; flex-shrink: 0; }
  .mini .tt { flex: 1; min-width: 0; }
  .mini .dn { color: var(--ok); font-size: 1.1rem; }
  .mini small { color: var(--text-secondary); font-size: .72rem; }

  /* ---------- Mục lục ---------- */
  .outline { position: sticky; top: calc(var(--header-height) + 30px); max-height: calc(100vh - var(--header-height) - 60px); display: flex; flex-direction: column; padding: 18px; }
  .outline h3 { font-size: 1rem; line-height: 1.35; }
  .prog-bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin: 10px 0 6px; }
  .prog-bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #3a7bfd, #7c5cff); transition: width .4s; }
  .prog-txt { font-size: .78rem; color: var(--text-secondary); text-align: center; margin-bottom: 12px; }
  .search { position: relative; margin-bottom: 12px; }
  .search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
  .search .inp { padding: 9px 12px 9px 36px; border-radius: 999px; font-size: .85rem; }
  #tree { overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
  .sec { margin-bottom: 8px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--border-color); overflow: hidden; }
  .sec-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: none; border: 0; color: var(--text-primary); cursor: pointer; text-align: left; font: 600 .85rem/1.35 'Poppins', sans-serif; }
  .sec-head:hover { background: rgba(255,255,255,.05); }
  .sec-head .t { flex: 1; min-width: 0; }
  .sec-head .cnt { font-size: .7rem; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
  .sec-head .chev { transition: transform .2s; color: var(--text-secondary); font-size: 1.2rem; }
  .sec.open .sec-head .chev { transform: rotate(180deg); }
  .sec-body { display: none; padding: 2px 6px 8px; }
  .sec.open .sec-body { display: block; }
  .les { display: flex; align-items: flex-start; gap: 10px; padding: 9px 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: .15s; }
  .les:hover { background: rgba(255,255,255,.07); }
  .les.playing { background: rgba(58,123,253,.22); border-color: rgba(58,123,253,.7); }
  .tick { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.35); background: none; color: #fff; font-size: .8rem; cursor: pointer; padding: 0; transition: .2s; }
  .tick:hover { border-color: var(--primary-color); }
  .tick.done { background: var(--primary-color); border-color: var(--primary-color); }
  .tick.static { cursor: default; border-style: dashed; border-color: rgba(255,255,255,.2); }
  .les-t { flex: 1; min-width: 0; font-size: .82rem; line-height: 1.4; }
  .les-t small { display: block; color: var(--text-secondary); font-size: .7rem; margin-top: 1px; }
  .tree-empty { text-align: center; color: var(--text-secondary); font-size: .85rem; padding: 18px 6px; }
  .hint { font-size: .72rem; color: var(--text-secondary); margin-top: 10px; text-align: center; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: rgba(20,22,28,.95); border: 1px solid var(--border-color); color: #fff; padding: 11px 20px; border-radius: 99px; font-size: .88rem; opacity: 0; transition: .25s; z-index: 2000; pointer-events: none; box-shadow: 0 8px 24px var(--shadow-color); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1100px) { .ls-layout { grid-template-columns: 1fr; } .outline { position: static; max-height: 480px; } }
  @media (max-width: 600px) { .ls-head h1 { font-size: 1.3rem; } .actions { justify-content: center; } }
</style>
</head>
<body data-active="lecture">
<main>
  <div class="wrap">
    <nav class="crumbs" id="crumbs" aria-label="Vị trí bài học">
      <a href="bai giang.html"><i class='bx bxs-videos'></i> Bài giảng</a>
    </nav>

    <div id="state" class="card" style="display:none"></div>

    <div class="ls-layout" id="layout" style="display:none">
      <div class="stack">
        <!-- 1. Tiêu đề & thông tin nhanh -->
        <section class="card ls-head">
          <div class="ls-kicker">
            <span class="badge info" id="h-no"></span>
            <span class="badge" id="h-sec" style="color:var(--text-secondary);border-color:var(--border-color)"></span>
            <span class="badge success" id="h-done" style="display:none"><i class='bx bx-check-circle'></i> Đã học</span>
          </div>
          <h1 id="h-title"></h1>
          <div class="ls-meta">
            <span id="m-dur" style="display:none"><i class='bx bx-time-five'></i><em style="font-style:normal"></em></span>
            <span id="m-date"><i class='bx bx-calendar'></i><em style="font-style:normal"></em></span>
            <span id="m-by"><i class='bx bx-user-voice'></i><em style="font-style:normal"></em></span>
          </div>
        </section>

        <!-- 2. Video bài giảng -->
        <section class="card player-card">
          <div class="player-box" id="player-box"></div>
        </section>

        <!-- 3. Thao tác: bài trước – đánh dấu – bài sau -->
        <section class="card actions">
          <a class="btn btn-g off" id="prev-btn" href="#"><i class='bx bx-chevron-left'></i> Bài trước</a>
          <div class="mid">
            <button class="btn btn-ok" id="done-btn" style="display:none"><i class='bx bx-check-circle'></i> <span>Đánh dấu đã học</span></button>
            <a class="btn btn-g" id="back-btn" href="bai giang.html"><i class='bx bx-list-ul'></i> Danh sách</a>
          </div>
          <a class="btn btn-p off" id="next-btn" href="#">Bài tiếp theo <i class='bx bx-chevron-right'></i></a>
        </section>

        <!-- 4. Thông tin bài học -->
        <section class="card">
          <h3><i class='bx bx-info-circle'></i> Thông tin bài học</h3>
          <div class="info-grid">
            <div class="info-it"><b>Lộ trình</b><span id="i-path"></span></div>
            <div class="info-it"><b>Phần</b><span id="i-sec"></span></div>
            <div class="info-it"><b>Vị trí</b><span id="i-pos"></span></div>
            <div class="info-it"><b>Thời lượng</b><span id="i-dur"></span></div>
            <div class="info-it"><b>Ngày đăng</b><span id="i-date"></span></div>
            <div class="info-it" id="i-st-box"><b id="i-st-lb">Trạng thái</b><span id="i-st"></span></div>
          </div>
        </section>

        <!-- 5. Các bài trong cùng phần -->
        <section class="card">
          <h3><i class='bx bx-collection'></i> Các bài trong phần này</h3>
          <p class="sub-t" id="sec-line"></p>
          <div class="mini" id="mini"></div>
        </section>
      </div>

      <!-- Mục lục lộ trình -->
      <aside class="card outline">
        <h3><i class='bx bx-map-alt'></i> <span id="path-name">Lộ trình</span></h3>
        <div id="prog-box" style="display:none">
          <div class="prog-bar"><i id="prog-fill"></i></div>
          <div class="prog-txt" id="prog-txt"></div>
        </div>
        <div class="search" style="margin-top:12px"><i class='bx bx-search'></i><input class="inp" id="q" placeholder="Tìm kiếm bài giảng" autocomplete="off"></div>
        <div id="tree"><div class="loader"></div></div>
        <p class="hint" id="tick-hint" style="display:none">Bấm vào vòng tròn để đánh dấu bài đã học</p>
      </aside>
    </div>
  </div>
</main>

<script src="shell.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = Shell.esc;
  const DEF_PATH = 'Bài giảng chung', DEF_SEC = 'Chưa phân phần';
  const LIST = 'bai giang.html', LESSON = 'bai hoc.html';

  // Lấy ID video từ mọi dạng link YouTube (watch?v=, youtu.be, shorts, embed, live)
  function ytId(u) {
    try {
      const x = new URL(u);
      const host = x.hostname.replace(/^(www|m)\./, '');
      let id = null;
      if (host === 'youtu.be') id = x.pathname.split('/')[1];
      else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
        id = x.searchParams.get('v');
        if (!id) { const m = x.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{11})/); if (m) id = m[2]; }
      }
      return /^[\w-]{11}$/.test(id || '') ? id : null;
    } catch { return null; }
  }

  let me = null, lectures = [], classes = [], done = {}, cur = null, toastT;
  const lessonId = new URLSearchParams(location.search).get('id');
  const collapsed = new Set();
  const isTeacher = () => !!me && me.role === 'teacher';
  const pathOf = l => l.path || DEF_PATH;
  const secOf = l => l.section || DEF_SEC;
  const className = id => (classes.find(c => String(c._id) === String(id)) || {}).name;
  const p2 = n => String(n).padStart(2, '0');
  const fmt = d => { const t = new Date(d); return `${p2(t.getHours())}:${p2(t.getMinutes())}, ${p2(t.getDate())}/${p2(t.getMonth() + 1)}/${t.getFullYear()}`; };
  const fmtDay = d => { const t = new Date(d); return `${p2(t.getDate())}/${p2(t.getMonth() + 1)}/${t.getFullYear()}`; };
  const href = id => `${LESSON}?id=${encodeURIComponent(id)}`;

  const toast = msg => {
    let t = $('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on'); clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('on'), 3000);
  };

  /* ---------- Dữ liệu dẫn xuất ---------- */
  const inPath = () => lectures.filter(l => pathOf(l) === pathOf(cur));
  const sectionsOf = list => { const m = new Map(); list.forEach(l => { const k = secOf(l); if (!m.has(k)) m.set(k, []); m.get(k).push(l); }); return m; };
  const ordered = () => [...sectionsOf(inPath()).values()].flat();      // đúng thứ tự hiển thị trong mục lục
  const matches = l => { const q = $('q').value.trim().toLowerCase(); return !q || l.title.toLowerCase().includes(q) || secOf(l).toLowerCase().includes(q); };

  /* ---------- Hiển thị ---------- */
  function showState(icon, text, withBack = true) {
    $('layout').style.display = 'none';
    const s = $('state'); s.style.display = '';
    s.innerHTML = `<div class="empty"><i class='bx ${icon}'></i>${esc(text)}${withBack ? `<div style="margin-top:16px"><a class="btn btn-p" href="${LIST}"><i class='bx bx-arrow-back'></i> Về danh sách bài giảng</a></div>` : ''}</div>`;
  }

  function renderLesson() {
    const list = ordered(), idx = list.findIndex(l => l.id === cur.id), n = list.length;
    const secList = sectionsOf(inPath()).get(secOf(cur)) || [];
    const secIdx = secList.findIndex(l => l.id === cur.id);
    const isDone = !!done[cur.id], t = isTeacher();

    document.title = `${cur.title} | NT`;
    $('crumbs').innerHTML = `<a href="${LIST}"><i class='bx bxs-videos'></i> Bài giảng</a><i class='bx bx-chevron-right'></i><span>${esc(pathOf(cur))}</span><i class='bx bx-chevron-right'></i><span>${esc(secOf(cur))}</span><i class='bx bx-chevron-right'></i><span class="cur">${esc(cur.title)}</span>`;

    $('h-no').textContent = `Bài ${idx + 1}/${n}`;
    $('h-sec').textContent = secOf(cur);
    $('h-done').style.display = !t && isDone ? '' : 'none';
    $('h-title').textContent = cur.title;
    const md = $('m-dur'); md.style.display = cur.duration ? '' : 'none'; md.querySelector('em').textContent = cur.duration || '';
    $('m-date').querySelector('em').textContent = `Đăng ngày ${fmtDay(cur.createdAt)}`;
    $('m-by').querySelector('em').textContent = cur.uploadedBy || '';

    // Thông tin bài học
    $('i-path').textContent = pathOf(cur);
    $('i-sec').textContent = secOf(cur);
    $('i-pos').textContent = `Bài ${secIdx + 1}/${secList.length} trong phần · Bài ${idx + 1}/${n} trong lộ trình`;
    $('i-dur').textContent = cur.duration || 'Chưa cập nhật';
    $('i-date').textContent = fmt(cur.createdAt);
    if (t) {
      $('i-st-lb').textContent = 'Lớp được xem';
      $('i-st').innerHTML = `<div class="tags">${(cur.classIds || []).length ? cur.classIds.map(id => `<span class="badge info">${esc(className(id) || 'Lớp đã xóa')}</span>`).join('') : '<span class="badge success">Tất cả học sinh</span>'}</div>`;
    } else {
      $('i-st-lb').textContent = 'Thời gian hoàn thành';
      $('i-st').textContent = isDone ? fmt(done[cur.id]) : 'Chưa hoàn thành';
    }

    // Thao tác
    const prev = list[idx - 1], next = list[idx + 1];
    const pb = $('prev-btn'), nb = $('next-btn');
    pb.classList.toggle('off', !prev); pb.href = prev ? href(prev.id) : '#'; pb.title = prev ? prev.title : '';
    nb.classList.toggle('off', !next); nb.href = next ? href(next.id) : '#'; nb.title = next ? next.title : '';
    const db = $('done-btn');
    db.style.display = t ? 'none' : '';
    db.className = 'btn ' + (isDone ? 'btn-g' : 'btn-ok');
    db.querySelector('span').textContent = isDone ? 'Bỏ đánh dấu đã học' : 'Đánh dấu đã học';
    db.querySelector('i').className = 'bx ' + (isDone ? 'bx-undo' : 'bx-check-circle');

    // Cùng phần
    $('sec-line').textContent = `${secOf(cur)} · ${secList.length} bài`;
    $('mini').innerHTML = secList.map((l, i) => `
      <a href="${href(l.id)}" class="${l.id === cur.id ? 'playing' : ''}">
        <span class="no">${i + 1}</span>
        <span class="tt">${esc(l.title)}${l.duration ? `<br><small>${esc(l.duration)}</small>` : ''}</span>
        ${!t && done[l.id] ? "<i class='bx bxs-check-circle dn'></i>" : ''}
      </a>`).join('');
  }

  function renderPlayer() {
    const box = $('player-box'), id = ytId(cur.url);
    if (id) {            // YouTube → nhúng khung xem
      box.innerHTML = `<iframe title="Video bài giảng" src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
    } else {             // Video cũ (Cloudinary…) → thẻ <video>
      box.innerHTML = '<video controls playsinline></video>';
      box.firstChild.src = cur.url;
    }
  }

  function renderProgress() {
    const list = inPath(), n = list.length, d = list.filter(l => done[l.id]).length, pct = n ? Math.round(d / n * 100) : 0;
    const student = !isTeacher();
    $('prog-box').style.display = student && n ? '' : 'none';
    $('prog-fill').style.width = pct + '%';
    $('prog-txt').textContent = `${d}/${n} bài · ${pct}% hoàn thành`;
  }

  function renderTree() {
    const list = inPath().filter(matches), q = $('q').value.trim(), t = isTeacher();
    if (!list.length) { $('tree').innerHTML = `<div class="tree-empty">${q ? 'Không tìm thấy bài giảng phù hợp.' : 'Chưa có bài giảng nào.'}</div>`; return; }
    $('tree').innerHTML = [...sectionsOf(list)].map(([name, items]) => {
      const all = inPath().filter(l => secOf(l) === name), d = all.filter(l => done[l.id]).length;
      const hasCur = items.some(l => l.id === cur.id);
      const open = q || hasCur || !collapsed.has(name) ? 'open' : '';
      return `<div class="sec ${open}" data-sec="${esc(name)}">
        <button class="sec-head" data-toggle><span class="t">${esc(name)}</span>${t ? '' : `<span class="cnt">${d}/${all.length}</span>`}<i class='bx bx-chevron-down chev'></i></button>
        <div class="sec-body">${items.map(l => `
          <div class="les ${l.id === cur.id ? 'playing' : ''}" data-id="${esc(l.id)}">
            ${t ? `<span class="tick static"></span>` : `<button class="tick ${done[l.id] ? 'done' : ''}" data-tick="${esc(l.id)}" title="${done[l.id] ? 'Bỏ đánh dấu' : 'Đánh dấu đã học'}">${done[l.id] ? "<i class='bx bx-check'></i>" : ''}</button>`}
            <div class="les-t">${esc(l.title)}${l.duration ? `<small>${esc(l.duration)}</small>` : ''}</div>
          </div>`).join('')}</div>
      </div>`;
    }).join('');
  }

  const refresh = () => { renderLesson(); renderTree(); renderProgress(); };

  /* ---------- Tương tác ---------- */
  $('q').addEventListener('input', renderTree);

  $('tree').addEventListener('click', e => {
    const tick = e.target.closest('[data-tick]');
    if (tick) { e.stopPropagation(); return toggleDone(tick.dataset.tick); }
    const head = e.target.closest('[data-toggle]');
    if (head) { const s = head.parentNode, n = s.dataset.sec; s.classList.toggle('open'); s.classList.contains('open') ? collapsed.delete(n) : collapsed.add(n); return; }
    const li = e.target.closest('.les'); if (!li || li.dataset.id === cur.id) return;
    location.href = href(li.dataset.id);
  });

  $('done-btn').onclick = () => toggleDone(cur.id);

  async function toggleDone(id) {
    const was = !!done[id];
    if (was) delete done[id]; else done[id] = new Date().toISOString();
    refresh();
    try {
      const r = await fetch(`/api/lectures/${encodeURIComponent(id)}/progress`, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done: !was }) });
      if (!r.ok) throw 0;
      const d = await r.json(); if (d.completedAt) done[id] = d.completedAt;
      refresh();
      if (!was && id === cur.id) toast('✅ Đã đánh dấu bài đã học');
    } catch {
      if (was) done[id] = new Date().toISOString(); else delete done[id];
      refresh(); toast('❌ Không lưu được tiến độ');
    }
  }

  /* ---------- Tải dữ liệu ---------- */
  async function loadClasses() {
    try { const r = await fetch('/api/classrooms/my', { credentials: 'include' }); classes = r.ok ? await r.json() : []; } catch { classes = []; }
  }
  async function loadProgress() {
    try {
      const r = await fetch('/api/lectures/progress', { credentials: 'include' });
      if (r.ok) (await r.json()).forEach(p => { done[p.lectureId] = p.completedAt; });
    } catch {}
  }

  (async () => {
    if (!lessonId) { location.replace(LIST); return; }
    try { const r = await fetch('/me', { credentials: 'include' }); if (r.ok) me = await r.json(); } catch {}
    if (isTeacher()) await loadClasses(); else { $('tick-hint').style.display = ''; await loadProgress(); }

    try {
      const r = await fetch('/api/lectures', { credentials: 'include' });
      if (r.status === 401) return showState('bx-lock-alt', 'Vui lòng đăng nhập để xem bài giảng.', false);
      if (!r.ok) throw new Error();
      lectures = await r.json();
    } catch { return showState('bx-error-circle', 'Không tải được bài giảng. Vui lòng thử lại sau.'); }

    cur = lectures.find(l => l.id === lessonId);
    if (!cur) return showState('bx-video-off', 'Không tìm thấy bài giảng này (có thể đã bị xóa hoặc bạn chưa được xem).');

    try { localStorage.setItem('lecPath', pathOf(cur)); } catch {}     // trang danh sách mở lại đúng lộ trình
    $('path-name').textContent = pathOf(cur);
    $('state').style.display = 'none';
    $('layout').style.display = '';
    renderPlayer();
    refresh();
    const active = document.querySelector('#tree .les.playing');
    if (active) active.scrollIntoView({ block: 'nearest' });
  })();
})();
</script>
</body>
</html>
